const DAY=864e5;
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ago=t=>{if(!t)return "noch nie";const d=Math.floor((new Date(dayKey(Date.now())).getTime()-new Date(dayKey(t)).getTime())/DAY);
  return d<=0?"heute, "+new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):d===1?"gestern":`vor ${d} Tagen`};
const daysSince=t=>t?Math.floor((Date.now()-t)/DAY):999;
const isLead=u=>u.role==="lead";
const hm=s=>{s=Math.round(s/60);return s>=60?`${Math.floor(s/60)} Std. ${s%60} Min.`:`${s} Min.`};
const teamOf=lead=>S.users.filter(u=>isLearner(u)&&u.lead===lead.id);
const visibleLearners=()=>canEdit()?S.users.filter(isLearner):S.users.filter(u=>isLearner(u)&&u.lead===S.user.id);
const lastDays=n=>[...Array(n)].map((_,i)=>dayKey(Date.now()-(n-1-i)*DAY));
const sumLog=(us,keys)=>keys.map(k=>us.reduce((a,u)=>a+((u.log||{})[k]||0),0));

/* Beispiel-Aktivität für den Prototyp: aus Lernzeit und letztem Login abgeleitet, damit Diagramme etwas zeigen */
(function seed(){let x=7;const r=()=>(x=(x*9301+49297)%233280)/233280;
  S.users.forEach(u=>{const m=/vor (\d+) Tagen/.exec(u.last||"");const off=u.last==="heute"?0:u.last==="gestern"?1:m?+m[1]:null;
    u.lastAt=off==null?null:Date.now()-off*DAY-Math.round(r()*5)*36e5;u.log=u.log||{};
    if(isLearner(u)&&off!=null&&u.time){const days=lastDays(21).filter((_,i)=>i<=20-off);const w=days.map(()=>r()<.35?0:.4+r());const tot=w.reduce((a,b)=>a+b,0)||1;days.forEach((k,i)=>u.log[k]=Math.round(u.time*w[i]/tot))}
    u.qa=u.qa||{};Object.keys(u.q||{}).forEach(k=>{if(!u.qa[k])u.qa[k]={n:r()<.3?2:1,best:80+Math.round(r()*4)*5}})});
  const lead=S.users.find(u=>u.id==="u5");if(lead)S.users.filter(isLearner).forEach(u=>{if(u.role==="setter")u.lead=lead.id});
})();

/* Tooltip, der allen Diagrammen dient */
function tipWire(root){const tip=$("ctip");if(!tip)return;root.querySelectorAll("[data-tip]").forEach(el=>{
  el.onmouseenter=el.onfocus=e=>{tip.innerHTML=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8,Math.max(8,r.left+r.width/2-tip.offsetWidth/2))+"px";tip.style.top=(r.top-tip.offsetHeight-8+window.scrollY)+"px"};
  el.onmouseleave=el.onblur=()=>tip.hidden=true})}

/* Säulendiagramm Lernzeit pro Tag (eine Reihe, Akzentfarbe) */
function activityChart(us,n=14){const keys=lastDays(n),vals=sumLog(us,keys).map(s=>Math.round(s/60)),max=Math.max(30,...vals),
  nice=Math.ceil(max/30)*30,W=640,H=210,L=38,B=26,T=10,cw=(W-L-6)/n,bw=Math.max(6,cw-10),y=v=>T+(H-T-B)*(1-v/nice);
  const grid=[0,.5,1].map(f=>{const v=Math.round(nice*f);return `<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-8}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`}).join("");
  const bars=vals.map((v,i)=>{const x=L+i*cw+(cw-bw)/2,h=Math.max(0,y(0)-y(v)),d=new Date(keys[i]),lab=d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
    const r=Math.min(4,h);return `<g class="hit" tabindex="0" data-tip="<b>${lab}</b><br>${v} Min. Lernzeit"><rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent"/>
    ${v?`<path d="M${x},${y(0)} v${-(h-r)} q0,${-r} ${r},${-r} h${bw-2*r} q${r},0 ${r},${r} v${h-r} z" class="bar"/>`:""}
    ${i%2===(n-1)%2?`<text x="${x+bw/2}" y="${H-8}" class="ax" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}.</text>`:""}</g>`}).join("");
  const total=vals.reduce((a,b)=>a+b,0),prev=sumLog(us,lastDays(2*n).slice(0,n)).reduce((a,b)=>a+b,0)/60,delta=prev?Math.round((total-prev)/prev*100):null;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Lernzeit pro Tag, letzte ${n} Tage">${grid}<line x1="${L}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}" class="base"/>${bars}<text x="${L}" y="${T-1}" class="ax">Min.</text></svg>`,total,delta,vals,keys}}

    <section class="card ssec"><div class="sh"><h3>So läuft es</h3></div><ol class="steps"><li><b>Briefing</b> einfügen, z. B. aus dem Kundengespräch oder seinem Skript.</li><li><b>Aufbau entwerfen</b>: Module und Lektionen als Vorschlag.</li><li><b>Übernehmen</b>, dann pro Modul <b>Ausformulieren</b>: Lerntexte und Quiz.</li><li>Unter „Inhalte bearbeiten“ <b>prüfen und anpassen</b>. Videos kommen später dazu.</li></ol>
    <p class="hint">Nur für dich sichtbar, nie für Kunden. KI-Anbieter: <b>${esc(provName())}</b> (ändern unter Einstellungen → Entwickler). Prüfe jeden Text, bevor du freigibst.</p></section></div>
  ${a.plan?`<section class="card ssec" style="margin-top:16px"><div class="sh"><h3>2. Entwurf: ${a.plan.length} Module</h3><p class="muted">Noch nicht gespeichert.</p></div>
    <div class="plan">${a.plan.map((m,i)=>`<div class="pm"><div class="row" style="justify-content:space-between"><b>${i+1}. ${esc(m.title)}</b><span>${m.roles.map(r=>`<span class="chip">${esc(ROLES[r])}</span>`).join(" ")}</span></div>
      ${m.goals.length?`<ul class="muted">${m.goals.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`:""}<ol>${m.lessons.map(l=>`<li>${esc(l.title)}${l.desc?` <span class="muted">· ${esc(l.desc)}</span>`:""}</li>`).join("")}</ol></div>`).join("")}</div>
    <div class="row" style="gap:10px;margin-top:14px">${mods.length?`<button class="btn primary" id="ai-add">An bestehende ${mods.length} Module anhängen</button><button class="btn" id="ai-rep">Bestehende Module ersetzen</button>`:`<button class="btn primary" id="ai-add">Übernehmen</button>`}<button class="btn ghost" id="ai-x">Verwerfen</button></div></section>`:""}
  ${mods.length?`<section class="card ssec" style="margin-top:16px"><div class="sh"><h3>3. Ausformulieren</h3><p class="muted">Pro Modul schreibt die KI die Lerntexte und 4 Quizfragen. Bestehende Texte des Moduls werden ersetzt.</p></div>
    ${mods.map(m=>{const busy=b&&b.kind==="mod"&&b.mid===m.id;return `<div class="srow"><div class="sl"><label>${esc(m.title)}</label><small>${plural(m.videos.length)} · ${(m.quiz||[]).length} Quizfragen${m.aiDone?" · von KI ausformuliert":""}</small></div><div class="sv">${busy?`<span class="row" style="gap:8px"><button class="btn sm" id="ai-stop">Stopp</button><span class="muted">schreibt … <span id="ai-t">0 s</span></span></span>`:m.videos.length?`<button class="btn sm ${m.aiDone?"ghost":""}" data-aimod="${m.id}" ${b?"disabled":""}>✦ ${m.aiDone?"Neu ausformulieren":"Ausformulieren"}</button>`:`<span class="muted" style="font-size:13px">erst Lektionen anlegen</span>`}</div></div>`}).join("")}</section>`:""}`;
  const br=$("ai-brief");if(br)br.oninput=()=>S.ai.brief=br.value;
  if($("ai-size"))$("ai-size").onchange=e=>S.ai.size=e.target.value;if($("ai-tone"))$("ai-tone").onchange=e=>S.ai.tone=e.target.value;
  if($("ai-go"))$("ai-go").onclick=()=>{if(S.ai.brief.trim().length<40){S.ai.err="Bitte beschreib die Firma und was gelernt werden soll in mindestens zwei, drei Sätzen.";return aiView()}aiRun("plan")};
  if($("ai-stop"))$("ai-stop").onclick=()=>aiCtl&&aiCtl.abort();
  if($("ai-add"))$("ai-add").onclick=()=>aiApply("add");if($("ai-rep"))$("ai-rep").onclick=()=>aiApply("replace");if($("ai-x"))$("ai-x").onclick=()=>{S.ai.plan=null;aiView()};
  document.querySelectorAll("[data-aimod]").forEach(x=>x.onclick=()=>aiRun("mod",x.dataset.aimod));
}

const ICON={mods:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.8"/><path d="M10 8.5v5l4-2.5z" fill="currentColor"/></svg>`,

  clock:`<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>`};
function notifs(){const u=S.user,out=[];
  if(isLearner(u)){(u.as||[]).filter(x=>!x.doneAt).forEach(x=>{const m=S.modules.find(y=>y.id===x.m);if(m)out.push({t:`Modul zugewiesen: ${m.title}`,s:`seit ${x.at}`,go:()=>{const ms=steps(u).filter(s=>s.m===m);const t=ms.find(s=>open(u,s)&&!done(u,s))||ms[0];if(t)goLesson(t.id)}})})}
  else if(u.role==="admin"||u.role==="lead"){const us=visibleLearners();
    us.filter(x=>daysSince(x.lastAt)>=S.cfg.remind).forEach(x=>out.push({t:`${x.name} ist inaktiv`,s:ago(x.lastAt),go:()=>{S.mem=x.id;S.page="member";render()}}));
    us.filter(x=>x.delReq).forEach(x=>out.push({t:`${x.name} möchte sein Konto löschen`,s:x.delReq,go:()=>{S.mem=x.id;S.page="member";render()}}));
    us.forEach(x=>(x.as||[]).filter(a=>a.doneAt).forEach(a=>{const m=S.modules.find(y=>y.id===a.m);if(m)out.push({t:`${x.name} hat „${m.title}“ erledigt`,s:a.doneAt,go:()=>{S.mem=x.id;S.page="member";render()}})}))}
  return out}
function topbar(){const n=notifs(),u=S.user;
  return `<div class="topbar"><button class="tb" id="tb-help" title="Hilfe" aria-label="Hilfe">${ICON.q}</button>
    <button class="tb" id="tb-theme" title="${THEME==="dark"?"Helles Design":"Dunkles Design"}" aria-label="${THEME==="dark"?"Helles Design":"Dunkles Design"}">${THEME==="dark"?ICON.sun:ICON.moon}</button>
    <span class="tbw"><button class="tb" id="tb-bell" title="Benachrichtigungen" aria-label="Benachrichtigungen" aria-expanded="${!!S.bell}">${ICON.bell}${n.length?`<i class="badge">${n.length>99?"99+":n.length}</i>`:""}</button>
    ${S.bell?`<div class="bellpop" role="menu"><div class="bh">Benachrichtigungen</div>${n.length?n.slice(0,8).map((x,i)=>`<button class="bi" role="menuitem" data-bi="${i}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></button>`).join(""):`<p class="muted" style="margin:6px 12px 12px;font-size:14px">Alles erledigt.</p>`}</div>`:""}</span>
    <button class="tb tbacc" id="tb-acc" title="Mein Konto" aria-label="Mein Konto">${ICON.gear}${avHTML(u,"sm")}</button></div>`}
function wireTop(){const n=notifs();
  if($("tb-bell"))$("tb-bell").onclick=e=>{e.stopPropagation();S.bell=!S.bell;shell()};
  document.querySelectorAll("[data-bi]").forEach(b=>b.onclick=()=>{S.bell=false;n[+b.dataset.bi].go()});
  if($("tb-theme"))$("tb-theme").onclick=toggleTheme;
  if($("tb-acc"))$("tb-acc").onclick=()=>{S.bell=false;S.page="account";S.prev=null;render()};
  if($("tb-help"))$("tb-help").onclick=()=>{window.open(`mailto:${S.cfg.support}?subject=${encodeURIComponent("Frage zur "+S.cfg.name+" "+S.cfg.sub)}`,"_blank")};
  if(S.bell)setTimeout(()=>document.addEventListener("click",function c(e){if(!e.target.closest(".bellpop")){S.bell=false;document.removeEventListener("click",c);shell()}}),0)}

function dash(){
  const u=learner(), p=pct(u), nb=BELTS.find(b=>b[2]>p), nx=nextStep(u), mods=track(u);
  const week=lastDays(7),wl=sumLog([u],week).map(s=>Math.round(s/60)),wsum=wl.reduce((a,b)=>a+b,0),wmax=Math.max(10,...wl),avg=Math.round(wsum/7);
  const last=nx||null,first=u.name.split(" ")[0];
  const mood=wsum>=60?`Du hast diese Woche schon ${hm(wsum*60)} gelernt. Stark, weiter so!`:wsum>0?`Diese Woche ${hm(wsum*60)} gelernt. Jede Lektion bringt dich näher an deinen nächsten Gürtel.`:p>0?`Schön, dass du wieder da bist. Mach heute mit deiner nächsten Lektion weiter.`:`Schön, dass du da bist. Starte mit deiner ersten Lektion.`;
  $("view").innerHTML=`
  ${(u.as||[]).filter(x=>!x.doneAt).map(x=>{const m=S.modules.find(y=>y.id===x.m);return m?`<div class="assign"><div><span class="lbl">Zugewiesen am ${esc(x.at)}</span><b>${esc(m.title)}</b><span class="muted">Bitte dieses Modul noch einmal komplett durchgehen. ${modPct(u,m)} % geschafft.</span></div><button class="btn primary" data-go="${m.id}">Jetzt starten ›</button></div>`:""}).join("")}
  <div class="hero">
    <section class="welcome"><div><h1>Willkommen zurück,<br><span>${esc(first)}!</span></h1><p>${esc(mood)}</p></div><div class="wav">${avHTML(u,"xl")}</div></section>
    ${last?`<button class="lastl" id="resume"><span class="lth">${cover(last.m)}</span><span class="ltx"><span class="lbl">${p?"Weiter geht's":"Deine erste Lektion"}</span><b>${esc(last.t==="v"?last.v.title:"Quiz: "+last.m.title)}</b>
      <span class="ltm">${ICON.clock} ${last.t==="v"?(isText(last.v)?readMin(last.v)+" Min. lesen":Math.max(1,Math.round(last.v.dur/60))+" Minuten"):last.m.quiz.length+" Fragen"}</span><span class="btn primary go">Weiterlernen ≫</span></span></button>`
      :`<div class="lastl done"><span class="ltx"><span class="lbl">Geschafft</span><b>Du hast alle Module abgeschlossen.</b></span></div>`}
  </div>
  <div class="quick">
    <button class="qt" data-q="mods"><span class="qi">${ICON.mods}</span>Deine Module</button>
    <button class="qt" data-q="docs"><span class="qi">${ICON.docs}</span>Unterlagen</button>
    <button class="qt" data-q="acc"><span class="qi">${ICON.acc}</span>Mein Konto</button>
    <button class="qt" data-q="help"><span class="qi">${ICON.help}</span>Frage stellen</button>
  </div>
  <h2 class="h2 bar" id="mods">Deine Module</h2>
  <div class="cards">${mods.map(m=>{const ms=steps(u).filter(s=>s.m===m),mp=modPct(u,m),lock=ms.length&&!open(u,ms[0]),st=!ms.length?"Inhalte folgen":lock?"Gesperrt":mp===100?"Abgeschlossen":mp>0?"Weiterlernen":"Nicht gestartet";
    return `<button class="mcard ${lock?"lk":""}" data-m="${m.id}">${cover(m)}<span class="mbody"><b>${esc(m.title)}</b>
      <span class="mstate ${st==="Abgeschlossen"?"ok":st==="Weiterlernen"?"go":""}">${lock?LOCK+" ":""}${st==="Weiterlernen"?`${mp} % Fortschritt`:st}</span>
      ${mp?`<span class="track"><span class="fill" style="width:${mp}%"></span></span>`:""}</span></button>`}).join("")}</div>
  <h2 class="h2 bar">Statistiken und Infos</h2>
  <div class="sgrid">
    <section class="card stc"><div class="lbl sthead">${ICON.clock} Deine Lernzeit</div><div class="stbody"><div><span class="big">${avg}<small> Min.</small></span><p class="muted">pro Tag im Schnitt, letzte 7 Tage. Insgesamt ${hm(wsum*60)}</p></div>
      <div class="mini" role="img" aria-label="Lernzeit der letzten 7 Tage">${wl.map((v,i)=>`<span class="mb" tabindex="0" data-tip="<b>${new Date(week[i]).toLocaleDateString("de-DE",{weekday:"long"})}</b><br>${v} Min."><i style="height:${Math.max(v?6:2,Math.round(v/wmax*100))}%"></i><em>${new Date(week[i]).toLocaleDateString("de-DE",{weekday:"short"}).slice(0,2)}</em></span>`).join("")}</div></div></section>
    <section class="card stc"><div class="lbl sthead">Dein Fortschritt</div><div class="stbody"><div class="ringw">${ring(p,86,false)}</div><div>${S.cfg.belts?`${beltHTML(p)}<p class="muted">${nb?`Noch ${nb[2]-p} % bis zum ${nb[0]}gurt.`:"Schwarzgurt. Alles gemeistert."}</p>`:`<b>${p} % geschafft</b>`}
      <p class="muted">${mods.filter(m=>modPct(u,m)===100).length} von ${mods.length} Modulen abgeschlossen.</p></div></div></section>
  </div>
  <div id="docs">${docsBlock(u).replace('<h2 class="h2">','<h2 class="h2 bar">')}</div>`;
  tipWire($("view"));
  if($("resume")&&nx)$("resume").onclick=()=>goLesson(nx.id);
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const q=b.dataset.q;if(q==="mods")$("mods").scrollIntoView({behavior:"smooth"});else if(q==="docs"){S.page="docs";render()}else if(q==="acc"){S.page="account";render()}else $("tb-help")&&$("tb-help").click()});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const m=S.modules.find(x=>x.id===b.dataset.go),ms=steps(u).filter(s=>s.m===m);const t=ms.find(s=>open(u,s)&&!done(u,s))||ms[0];if(t)goLesson(t.id)});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=S.modules.find(x=>x.id===b.dataset.m),ms=steps(u).filter(s=>s.m===m);if(!ms.length)return;const t=ms.find(s=>open(u,s)&&!done(u,s))||ms[0];goLesson(t.id)});
  wireDocs();
}

function drawSpar(u,deck){const box=$("sparbox");if(!box)return;const s=S.spar=S.spar&&S.spar.deck===deck.length?S.spar:{deck:deck.length,i:Math.floor(Math.random()*deck.length),show:false,done:0,ok:0};const c=deck[s.i%deck.length];
  box.innerHTML=`<div class="scard ${s.show?"flip":""}"><span class="lbl">Kunde sagt</span><p class="sq">„${esc(c.q)}“</p>${s.show?`<span class="lbl">Deine Antwort</span><p class="sa">${esc(c.a)}</p>`:`<p class="muted" style="margin:0">Überleg dir deine Antwort, dann deck auf.</p>`}</div>
  <div class="row" style="justify-content:space-between;margin-top:12px"><span class="muted" style="font-size:13px">Heute geübt: ${s.done} · gewusst: ${s.ok}</span><span class="row" style="gap:8px">${s.show?`<button class="btn sm" data-sp="again">Nochmal üben</button><button class="btn sm primary" data-sp="ok">Wusste ich ✓</button>`:`<button class="btn sm primary" data-sp="show">Antwort zeigen</button>`}</span></div>`;
  box.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{const k=b.dataset.sp;if(k==="show")s.show=true;else{s.done++;if(k==="ok")s.ok++;s.show=false;let n;do{n=Math.floor(Math.random()*deck.length)}while(deck.length>1&&n===s.i);s.i=n;const dk=dayKey(Date.now());u.log=u.log||{};u.log[dk]=(u.log[dk]||0)+40;u.time=(u.time||0)+40}drawSpar(u,deck)})}

function isoWeek(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}

function syncDraft(){const d=S.draft;if(!d||!$("e-q"))return;d.q=$("e-q").value;

  if(d.type==="order") d.items=os}
function wireEditor(){
  document.querySelectorAll("input[name=e-art]").forEach(r=>r.onchange=()=>{S.edArt=r.value;document.querySelectorAll(".ap").forEach(l=>l.classList.toggle("on",l.contains(r)))});
  const ei=$("e-img");if(ei)ei.onchange=()=>{const f=ei.files[0];if(!f)return;if(f.size>1e6){toast("Bild bitte kleiner als 1 MB");return}const r=new FileReader();r.onload=()=>{S.edImg=r.result;adminContent()};r.readAsDataURL(f)};
  if($("e-imgx"))$("e-imgx").onclick=()=>{S.edImg=null;adminContent()};
  const E=S.ed; if(!E) return;
  const fail=x=>{$("ee").textContent=x;$("ee").hidden=false};
  $("ecancel").onclick=()=>{S.ed=null;S.draft=null;adminContent()};
  if(E.k==="q"){const d=S.draft;
    $("e-ty").onchange=()=>{syncDraft();const nt=$("e-ty").value;
      if((nt==="mc"||nt==="assign")&&!(d.a&&d.a.length)){d.a=["",""];d.c=0}
      if(nt==="fit"&&!(d.items&&d.items.length&&Array.isArray(d.items[0]))) d.items=[["",true],["",false]];
      if(nt==="order"&&!(d.items&&d.items.length&&!Array.isArray(d.items[0]))) d.items=["","",""];
      d.type=nt;$("ed").innerHTML=editorHTML();wireEditor()};
    $("eadd").onclick=()=>{syncDraft();if(d.type==="mc"||d.type==="assign")d.a.push("");else if(d.type==="fit")d.items.push(["",true]);else d.items.push("");$("ed").innerHTML=editorHTML();wireEditor()};
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{syncDraft();const j=+b.dataset.rm;if(d.type==="mc"||d.type==="assign"){d.a.splice(j,1);if(d.c===j)d.c=null;else if(d.c>j)d.c--}else d.items.splice(j,1);$("ed").innerHTML=editorHTML();wireEditor()});
  }
  $("ef").onsubmit=e=>{e.preventDefault();
    const m=S.modules.find(x=>x.id===E.mid);
    if(E.k==="mod"){const t=$("e-t").value.trim(),roles=[$("e-rs").checked&&"setter",$("e-rc").checked&&"closer"].filter(Boolean),goals=$("e-g").value.split("\n").map(x=>x.trim()).filter(Boolean);
      if(!t) return fail("Gib dem Modul einen Namen.");
      if(!roles.length) return fail("Wähle mindestens eine Rolle aus.");
      if(m){Object.assign(m,{title:t,roles,goals});if(S.edImg!==undefined){m.img=S.edImg||null;S.edImg=undefined}const ar=document.querySelector("input[name=e-art]:checked");if(ar)m.art=ar.value;S.edArt=null;toast("Modul gespeichert")}
      else{const nm={id:"m"+Date.now(),title:t,roles,goals,videos:[],quiz:[]};S.modules.push(nm);toast("Modul angelegt")}
      S.ed=null;return adminContent()}
    if(E.k==="vid"){const t=$("e-t").value.trim(),f=$("e-f").files[0];
      if(!t) return fail("Gib dem Video eine Überschrift.");
      let v=E.id?m.videos.find(x=>x.id===E.id):null;
      if(!v){v={id:"v"+Date.now(),dur:0};m.videos.push(v)}
      v.title=t;v.desc=$("e-d").value.trim()||"Ohne Beschreibung";v.req=$("e-req").checked;v.noskip=$("e-ns").checked;v.note={type:$("e-nty").value,text:$("e-nt").value.trim()};v.check=$("e-ck").value.split("\n").map(x=>x.trim()).filter(Boolean);
      if(f){v.src=URL.createObjectURL(f);const p=document.createElement("video");p.preload="metadata";p.src=v.src;p.onloadedmetadata=()=>{v.dur=p.duration||0;if(S.page==="content")adminContent()}}
      toast(E.id?"Video gespeichert":"Video angelegt");S.ed=null;return adminContent()}
    syncDraft();const d=S.draft;
    if(!d.q.trim()) return fail("Schreib die Frage.");
    let q={type:d.type,q:d.q.trim()};
    if(d.type==="mc"||d.type==="assign"){const a=d.a.map(x=>x.trim());if(a.filter(Boolean).length<2||a.some(x=>!x)) return fail("Fülle mindestens zwei Antworten aus und lösche leere Zeilen.");if(d.c==null) return fail("Markiere die richtige Antwort.");q.a=a;q.c=d.c}
    if(d.type==="fit"){const it=d.items.map(([x,v])=>[x.trim(),v]);if(it.length<2||it.some(([x])=>!x)) return fail("Fülle mindestens zwei Sätze aus und lösche leere Zeilen.");q.items=it}
    if(d.type==="order"){const it=d.items.map(x=>x.trim());if(it.length<3||it.some(x=>!x)) return fail("Fülle mindestens drei Schritte aus und lösche leere Zeilen.");q.items=it}
    m.quiz=m.quiz||[];if(E.idx==null)m.quiz.push(q);else m.quiz[E.idx]=q;
    toast("Frage gespeichert");S.ed=null;S.draft=null;adminContent()};
}

function unlockAll(){S.cfg.order=false;S.cfg.noskip=false;S.users.forEach(u=>u.free=true);if(S.user)render()}
(function(){let ok=false,all=false;try{ok=sessionStorage.getItem("dojo-ok")==="1";all=sessionStorage.getItem("dojo-all")==="1"}catch(e){}if(all)unlockAll();if(ok)return;
  const g=document.createElement("div");g.className="gate";g.innerHTML=`<form class="gbox"><div class="brand"><b>DOJO</b><span>Academy</span></div><p>Vorschau-Version. Bitte gib den Zugangscode ein, den du bekommen hast.</p><label class="lbl" for="gc">Zugangscode</label><input id="gc" type="password" autocomplete="off" autofocus><p class="msg warn" id="gm" hidden>Der Code stimmt nicht.</p><button class="btn primary wide" type="submit">Weiter</button><small class="muted">Im Vorschau-Modus wird nichts gespeichert. Nach dem Neuladen startet alles von vorn.</small></form>`;
  document.body.appendChild(g);g.querySelector("form").onsubmit=e=>{e.preventDefault();const v=g.querySelector("#gc").value.trim().toLowerCase();if(v===ACCESS_CODE||v===ALL_CODE){try{sessionStorage.setItem("dojo-ok","1");if(v===ALL_CODE)sessionStorage.setItem("dojo-all","1")}catch(e){}if(v===ALL_CODE)unlockAll();g.remove()}else g.querySelector("#gm").hidden=false}})();
</script>
<style>.gate{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#16233f,#0e1830);display:grid;place-items:center;padding:20px}.gbox{background:var(--surface);color:var(--fg);border-radius:16px;padding:28px;width:min(420px,100%);display:grid;gap:10px}.gbox input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}.gbox p{margin:0}</style>
</body></html>
