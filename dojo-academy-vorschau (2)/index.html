<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>DOJO Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: App-Shell — linke Sidebar (Profil, Navigation, Arbeitsplatz-Links), rechts Dashboard / Lektion mit Lektionsliste / Admin-Statistik */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --raise:#eef0ea; --line:#e1e4db; --side:#fbfbf8;
  --fg:#1c2024; --muted:#5b6168; --accent:#f08a24; --accent-ink:#a9500a; --on-accent:#231204;
  --navy:#13203a; --navy2:#1f3a63; --ok:#2e7d4f; --warn:#a85d06; --lock:#9aa0a6; --screen:#1d2125;
  --display:"Outfit",system-ui,sans-serif; --body:"Outfit",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-stretch:85%;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
a{color:inherit;text-decoration:none}
.muted{color:var(--muted)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:500;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.primary:disabled{background:var(--raise);border-color:var(--line);color:var(--muted)}
.btn.ghost{background:transparent} .btn.sm{padding:5px 11px;font-size:13px} .btn.wide{width:100%} .btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.55}
.linkbtn{color:var(--accent-ink);font-size:13px}
.msg{font-size:14px;margin:10px 0 0;color:var(--muted)} .msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
.field{display:grid;gap:6px;margin-top:14px}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
.field input[type=checkbox],.field input[type=radio]{width:auto;padding:0}
.erow select{width:auto;flex:none}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:26px;letter-spacing:.04em}
.brand span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.belt{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.belt i{display:inline-block;width:34px;height:9px;border-radius:2px;border:1px solid rgba(127,127,127,.5);position:relative}
.belt i::after{content:"";position:absolute;right:5px;top:-1px;bottom:-1px;width:5px;background:rgba(0,0,0,.3)}
.beltrow{display:flex;gap:4px;margin:22px 0 0}
.beltrow i{flex:1;height:8px;border-radius:2px;border:1px solid rgba(255,255,255,.2)}
.track{display:block;height:6px;background:var(--raise);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lbrand{background:var(--navy);color:#eef0f4;padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:center}
.lbrand .brand span{color:#9aa3b5} .lbrand h1{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.05;margin-top:40px}
.lbrand h1 em{font-style:normal;color:var(--accent)} .lbrand p{color:#b6bdcb;max-width:42ch}
.lform{align-self:center;justify-self:center;width:100%;max-width:400px;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px 24px}
.lform h2{font-size:32px;font-weight:800}
.lform .wide{margin-top:18px;padding:12px}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:22px;font-size:13px}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side>.brand{padding:0 10px 18px}
.me{display:flex;gap:10px;align-items:center;background:var(--raise);border-radius:10px;padding:10px;margin-bottom:10px}
.me b{display:block;font-size:14px;font-weight:600} .me small{color:var(--muted);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.av.sm{width:30px;height:30px;font-size:11px}
.sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:8px;font-size:14px}
.nav:hover{background:var(--raise)} .nav.on{background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:600}
.ni{width:18px;text-align:center;color:var(--muted)}
.sidefoot{margin-top:auto;padding-top:18px;display:grid;gap:8px}
.proto{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px dashed var(--line);color:var(--muted);padding:4px 8px;border-radius:99px;justify-self:start;margin-left:10px}
.main{min-width:0;padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 32px}
#view{max-width:1180px}
.prevbar{background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px;font-size:14px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.phead h1{font-size:clamp(28px,3.4vw,40px);font-weight:800}
.phead p{margin:2px 0 0}
.h2{font-size:20px;font-weight:700;margin:30px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.beltcard{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px}
/* covers */
.cover{--c:#f08a24;position:relative;overflow:hidden;background:var(--navy);border-radius:10px;aspect-ratio:16/9;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;color:#fff}
.cover::before{content:"";position:absolute;right:-30%;top:-40%;width:80%;height:140%;background:var(--c);opacity:.9;transform:rotate(18deg)}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}
.cnum{position:absolute;top:10px;left:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c9cfdb;z-index:1}
.ctitle{position:relative;z-index:1;font-family:var(--display);font-stretch:75%;font-size:17px;line-height:1.05;letter-spacing:.03em}
.ctitle b{font-weight:800;font-size:1.25em}
.resume{display:grid;grid-template-columns:200px 1fr auto;gap:20px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.resume:hover{border-color:var(--accent)} .resume .rtext{display:grid;gap:2px;min-width:0} .resume b{font-size:20px;font-family:var(--display);font-stretch:85%}
.resume.done{display:block;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:10px;text-align:left}
.mcard:hover{border-color:var(--accent)} .mcard.lk .cover{filter:grayscale(.85) brightness(.85)}
.mbody{display:grid;gap:6px;padding:0 4px 4px} .mbody b{font-weight:600} .mmeta{font-size:12px;color:var(--muted)}
.mstate{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.mstate.ok{color:var(--ok)} .mstate.go{color:var(--accent-ink)}
.docs{display:grid;gap:8px}
.docrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dicon,.th.doc{background:#fbe7d6;color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:6px;padding:8px 7px;letter-spacing:.06em}
.dt{flex:1 1 180px;min-width:0;display:grid;overflow-wrap:anywhere} .dt small{color:var(--muted);font-size:12px}
/* lesson */
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{color:var(--fg);font-weight:500} .crumb button:hover{color:var(--accent-ink)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.lmain{display:grid;gap:16px;min-width:0}
.mhead{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--navy);color:#fff;border-radius:var(--r);padding:10px 14px 10px 10px}
.mhead .cover{padding:0;border-radius:7px} .mhead .cover .ctitle,.mhead .cover .cnum{display:none}
.mhead .kick{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#aab2c3} .mhead b{font-family:var(--display);font-stretch:85%;font-size:20px}
.lcard{padding:22px;display:grid;gap:14px}
.lcard h2{font-size:26px;font-weight:700}
.screen{aspect-ratio:16/9;max-width:100%;background:var(--screen);position:relative;display:grid;place-items:center;color:#eceee9;border-radius:10px;overflow:hidden}
.screen video{width:100%;height:100%;display:block;background:#000}
.ph{text-align:center;padding:20px} .ph .t{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:clamp(22px,3.2vw,32px)}
.play{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:22px;margin-top:14px;text-align:center}
.scrub{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.14)} .scrub b{display:block;height:100%;background:var(--accent)}
.lockbig{color:#a3a9ae}
.box{border-radius:10px;padding:12px 14px;font-size:14px;border:1px solid}
.box ul{margin:6px 0 0;padding-left:18px}
.box.info{background:#eaf1fb;border-color:#c5d8f3;color:#1f3f6e} .box.warn{background:#fdf3e4;border-color:#f3d4a6;color:#7a4508}
.box.success{background:#e6f4ec;border-color:#bfe0cc;color:#1e5a37} .box.error{background:#fbe9e9;border-color:#f0c4c4;color:#7a2222}
.checks2{display:grid;gap:6px} .checks2 label{display:flex;gap:8px;align-items:center}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.nextcard{display:grid;gap:2px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;text-align:left}
.nextcard:hover{border-color:var(--accent)} .nextcard b{font-weight:600}
.lside{position:sticky;top:20px} .lside .card{padding:12px;display:grid;gap:4px}
.lsh{display:grid;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.li{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;width:100%;padding:6px;border-radius:8px;border:1px solid transparent;text-align:left}
.li:hover{background:var(--raise)} .li.on{border-color:var(--fg);background:var(--surface)} .li.lk{color:var(--muted)}
.th{--c:#f08a24;height:34px;border-radius:6px;background:linear-gradient(135deg,var(--navy) 55%,var(--c) 55%);color:#fff;display:grid;place-items:center}
.li.lk .th{filter:grayscale(1);opacity:.6}
.lt{min-width:0;font-size:13.5px;line-height:1.3} .lt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.lside .btn{margin-top:8px}
/* quiz */
.quiz{display:grid;gap:16px}
.q fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0;display:grid;gap:8px}
.q legend{font-weight:600;padding:0 6px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.q label:hover{background:var(--raise)} .q label.right,.q .yn.right{background:#e3f2e8} .q label.wrong,.q .yn.wrong{background:#fbe7d6}
.qtype{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin:-2px 0 4px}
.yn{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px;border-radius:6px;border-top:1px solid var(--line)}
.yn>span:first-child{flex:1 1 260px;min-width:0} .ynb{display:flex;gap:4px} .q .ynb label{padding:4px 10px;border:1px solid var(--line)}
.yn select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
/* docs view */
.docv{padding:24px;display:grid;gap:14px;margin-top:18px}
.docl{list-style:none;margin:0;padding:0;display:grid}
.docl li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.docl .dh{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:16px} .docl p{margin:4px 0 0;max-width:68ch}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px} .kpi .num{font-size:26px;display:block;margin-top:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:960px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}

.addform .field{margin:0} .addform .msg{grid-column:1/-1}
.role{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--raise);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.edit-on{border-color:var(--accent)}
.clist{display:grid;gap:16px}
.citem{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.erow{display:flex;gap:8px;align-items:center}
.erow .e-o{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.erow select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.checks{display:flex;gap:14px;flex-wrap:wrap} .checks label{display:flex;gap:6px;align-items:center}
.sticky{position:sticky;top:20px}
@media (max-width:1000px){.lgrid,.two{grid-template-columns:1fr}.lside,.sticky{position:static}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}

  .login{grid-template-columns:1fr} .lbrand{padding:32px max(16px,env(safe-area-inset-left,0px))}
  .resume{grid-template-columns:1fr} .mhead{grid-template-columns:64px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.addform[hidden]{display:none!important}.reading{max-width:68ch;font-size:16.5px;line-height:1.65}.reading p{margin:0 0 14px}.reading h3{font-family:Archivo,sans-serif;font-size:18px;margin:22px 0 8px}.reading blockquote{margin:0 0 14px;padding:12px 16px;border-left:3px solid var(--accent,#f08a24);background:#fff6ee;border-radius:0 8px 8px 0}.reading ul{margin:0 0 14px;padding-left:20px}.reading li{margin:4px 0}
.assign{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;margin:0 0 18px;border:1px solid var(--accent);background:#fff6ee;border-radius:12px}.assign>div{display:flex;flex-direction:column;gap:3px}.assign b{font-size:17px}.asg{display:flex;flex-direction:column;font-size:13px;font-weight:600;line-height:1.3;margin:2px 0;white-space:nowrap}.asg small{font-weight:400;color:var(--warn)}.asg.ok small{color:var(--ok,#2e7d4f)}.asel{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:150px}
.blogo{max-height:34px;max-width:170px;display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}

.srow{display:grid;grid-template-columns:minmax(200px,1fr) minmax(220px,1.3fr);gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}.sl label{font-weight:600;font-size:14px;display:block}.sl small{color:var(--muted);font-size:13px;display:block;margin-top:2px}

.numin{display:inline-flex;align-items:center;gap:8px}.numin input{width:96px!important}.numin span{color:var(--muted);font-size:14px}

.nc{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(19,32,58,.06),0 4px 14px rgba(19,32,58,.05);min-height:150px}
.nc b{font-size:17px;font-weight:600}.nc p{margin:0;color:var(--muted);font-size:14px;flex:1}.nc.dark{background:linear-gradient(160deg,#16233f,#0f1a30);color:#fff}.nc.dark p{color:#c5cfdd}.nc.dark .lbl{color:#9fb0c9}
.soonb{align-self:flex-start;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(240,138,36,.16);color:var(--accent-ink)}.nc.dark .soonb{color:#ffb877}.nc a.btn{align-self:flex-start}
.mini{position:relative}.mb.hit i{background:var(--accent);opacity:1}.mini .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--accent);opacity:.6;pointer-events:none}
.artpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}.ap{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:10px;background:#16233f;cursor:pointer;border:2px solid transparent}
.ap input{position:absolute;opacity:0}.ap svg{width:100%;height:46px}.ap small{color:#c5cfdd;font-size:10.5px;text-align:center;line-height:1.2}.ap.on{border-color:var(--accent)}.ap:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:900px){.hero2,.two2{grid-template-columns:1fr}.dojohero::after{display:none}.goal{width:104px;height:104px}}
@media(max-width:600px){.dojohero{flex-direction:column;align-items:flex-start}.cover .art{width:70%}}
.hs b.beltdot{min-height:0;height:12px;margin:8px 0 6px}.pnode.done.light .pdot{color:var(--navy);border-color:#cfd6e1}.pnode.done.light .pdot svg{filter:none}

/* --- Dunkles Design --- */
:root[data-theme="dark"]{--ok:#5cc488;--warn:#f0a24a;--accent-ink:#ffb877;--bg:#0e1524;--surface:#16203a;--raise:#1d2945;--line:#2a3757;--side:#111a2e;--fg:#e8edf5;--muted:#9aa8bf;--navy:#0a1222;--navy2:#1c3157;color-scheme:dark}
:root[data-theme="dark"] body{background:var(--bg)}
:root[data-theme="dark"] .welcome,:root[data-theme="dark"] .mission,:root[data-theme="dark"] .qt,:root[data-theme="dark"] .nc:not(.dark){background:var(--surface);color:var(--fg)}
:root[data-theme="dark"] .qi,:root[data-theme="dark"] .pnode:not(.done):not(.cur) .pdot{background:var(--raise);color:var(--fg);border-color:var(--line)}:root[data-theme="dark"] .pnode.cur .pdot{background:var(--surface);color:#ffb877}:root[data-theme="dark"] .pnode.done.light .pdot{border-color:#fff}
:root[data-theme="dark"] .tb{background:var(--surface);color:var(--fg)}:root[data-theme="dark"] .tb:hover{background:var(--raise)}
:root[data-theme="dark"] .bellpop{background:var(--surface)}:root[data-theme="dark"] .bi:hover{background:var(--raise)}
:root[data-theme="dark"] .asel,:root[data-theme="dark"] .ctl select,:root[data-theme="dark"] .aigrid select,:root[data-theme="dark"] .wtool .wtitle,:root[data-theme="dark"] .wtool button{background:var(--raise);color:var(--fg)}
:root[data-theme="dark"] .box.info{background:#14284a;border-color:#27477a;color:#cfe0ff}:root[data-theme="dark"] .box.warn,:root[data-theme="dark"] .kt.alert,:root[data-theme="dark"] .assign,:root[data-theme="dark"] .dbar{background:#33240f;border-color:#7a5212;color:#ffd7a0}
:root[data-theme="dark"] .box.success{background:#12301f;border-color:#265c3c;color:#bfe8cf}:root[data-theme="dark"] .box.error{background:#3a1616;border-color:#7a2a2a;color:#ffc9c9}
:root[data-theme="dark"] .rank li.me,:root[data-theme="dark"] .opt.on{background:#33240f}:root[data-theme="dark"] tr.click:hover td{background:var(--raise)}
:root[data-theme="dark"] .pill{background:#1d3358;color:#bcd3ff}:root[data-theme="dark"] .wsbar{background:#14284a;border-color:#27477a;color:#cfe0ff}
:root[data-theme="dark"] .pline{background:repeating-linear-gradient(90deg,#34446a 0 6px,transparent 6px 11px)}
:root[data-theme="dark"] .chart .base{stroke:#3a4a6e}:root[data-theme="dark"] .h2.bar{border-left-color:var(--accent)}
/* --- Podcast --- */
.podhero{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;padding:24px;border-radius:18px;background:linear-gradient(160deg,#16233f,#0f1a30);color:#fff}
.pcov{aspect-ratio:1;border-radius:14px;overflow:hidden;background:radial-gradient(80% 80% at 30% 20%,rgba(240,138,36,.4),transparent),#0b1426;display:grid;place-items:center}.pcov img{width:100%;height:100%;object-fit:cover}.pcov span svg{width:64px;height:64px;color:#fff}
.pinfo{display:flex;flex-direction:column;gap:10px;min-width:0}.pinfo .lbl{color:#9fb0c9}.pinfo h2{font-size:26px;font-weight:600}.pinfo p{margin:0;color:#c5cfdd}
.plist{display:grid;gap:8px}.pep{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);text-align:left;box-shadow:0 1px 2px rgba(19,32,58,.06)}.pep.on{outline:2px solid var(--accent)}
.pno{width:42px;height:42px;border-radius:10px;background:var(--raise);display:grid;place-items:center;font-weight:600}.pep b{display:block;font-weight:500}.pep small{color:var(--muted)}.pplay{font-size:13px;color:var(--accent-ink);font-weight:600}
@media(max-width:700px){.podhero{grid-template-columns:1fr}.pcov{max-width:160px}}

  ["Erlaubnis","Deshalb meine Frage: Ist es gestattet, sofort auf den Punkt zu kommen und die Katze aus dem Sack zu lassen? Gestattet?"],
  ["Offenheit & Nutzen","Ich bin ganz offen: Ich möchte Sie gerne als neuen Kunden gewinnen. Und es gibt eine Reihe sehr überzeugender Argumente, warum sich ein persönliches Treffen voll und ganz für Sie auszahlen wird – gerade wenn es darum geht, in Ihrem Unternehmen intelligente Automatisierungen, KI-Lösungen und schlanke Workflows einzuführen, die Ihnen und Ihrem Team spürbar Zeit, Kosten und Nerven sparen. Allerdings NUR DANN, wenn Sie dadurch langfristig wirklich deutlich besser fahren als heute. NUR DANN macht ein persönliches Gespräch überhaupt Sinn."],
  ["Erlaubnis für Fragen","Deshalb ist es wichtig, Ihnen vorab 2, 3 kurze Fragen zu stellen. Ist es gestattet, Ihnen hierzu 2, 3 kurze Fragen zu stellen? Gestattet?"],
  ["Bedarfsfrage 1","Nur mal angenommen, Sie würden in Ihrem Unternehmen gezielt Automatisierungen und KI-Workflows einführen, die repetitive Aufgaben übernehmen und Prozesse deutlich beschleunigen … Was wäre Ihnen dabei besonders wichtig? Worauf würden Sie in diesem Zusammenhang achten?"],
  ["Bedarfsfrage 2","Was, einmal abgesehen davon, ist Ihnen darüber hinaus noch wichtig, wenn Sie solche Automatisierungen und KI-Implementierungen in Ihrem Unternehmen umsetzen? Worauf würden Sie sonst noch achten, damit sich ein Treffen bzw. ein persönliches Gespräch wirklich für Sie lohnt?"],
  ["Bedarfsfrage 3","Mmmm …, welche der vorgenannten Punkte sind Ihnen besonders wichtig? Auf welche der von Ihnen genannten Punkte legen Sie am allermeisten Wert?"],
  ["Zusage","Angenommen, wir würden genau die Automatisierungen und KI-Workflows identifizieren und umsetzen, die bei Ihnen den größten Hebel haben – also spürbar weniger manuelle Arbeit, schnellere Prozesse und klar messbare Effizienzgewinne. Wäre es dann vollkommen naiv und töricht gewesen, dass Sie eine halbe Stunde Zeit investiert und unser Angebot geprüft haben? Wäre es dann vollkommene Zeitverschwendung gewesen? Wäre es das in diesem Fall?"],
  ["Termin","Prima! Deshalb meine Frage: Was ist denn der [Datum] für ein Tag bei Ihnen? Passt es Ihnen da besser am Vormittag oder am Nachmittag? Was passt Ihnen besser? Der Vormittag oder der Nachmittag? Mmmm …, da lieber um [Uhrzeit A] oder um [Uhrzeit B]? Was passt Ihnen besser? [Uhrzeit A] oder [Uhrzeit B]? Was passt besser?"],
  ["E-Mail","An welche E-Mail-Adresse darf ich Ihnen die Terminbestätigung senden?"],
  ["Vorfreude","Ist noch eine letzte Frage gestattet? Auf was freuen Sie sich denn während unseres Treffens am allermeisten?"],
  ["Bestätigung","Super, dann jetzt einmal bitte in Ihre Mails schauen und den Termin einmal bestätigen, damit ist er dann bei meinem Chef und bei Ihnen auch geblockt."],
  ["Verabschiedung","Vielen Dank, Herr/Frau Geschäftsführer/in. Am [Datum und Uhrzeit] wird das Ganze dann unser Chef Herr Kuzucuk mit Ihnen durchgehen. Bis dahin eine erfolgreiche restliche Woche."]]};
const DOC_EINWAND={pdf:["ApexFlux_Setter_Einwandbehandlung.pdf",PDF_EINWAND],title:"Einwandbehandlung für Setter",kind:"Leitfaden",intro:"Grundprinzip: Einwand nicht als Ablehnung behandeln, sondern als Anlass für eine kurze Rückfrage. Nicht diskutieren, nicht rechtfertigen und nicht überreden. Ziel ist es, den tatsächlichen Grund zu verstehen und, wenn sinnvoll, den nächsten Schritt zu vereinbaren.",
  merksatz:"Einwand → Rückfrage → Bedarf → nächster Schritt",blocks:[
  ["„Kein Interesse“","Das verstehe ich – an dieser Stelle wissen Sie ja auch noch gar nicht, worum es überhaupt geht. Genau deshalb rufe ich Sie nicht an, um Ihnen etwas zu verkaufen, sondern um gemeinsam mit Ihnen in 2, 3 kurzen Fragen herauszufinden, ob sich ein Gespräch für Sie überhaupt lohnt. Ist es gestattet, Ihnen dazu kurz 2, 3 Fragen zu stellen? Gestattet?"],
  ["„Ich habe keine Zeit“","Ich verstehe, dass Sie beschäftigt sind. Also ist es Ihnen wichtig, dass ich die Katze aus dem Sack lasse? Ist das gestattet?"],
  ["„Schicken Sie mir Infos per Mail“","Gerne, nur damit wir beide unsere Zeit nicht verschwenden: Geht es Ihnen gerade darum, erstmal Informationen zu sammeln, oder wäre eine Lösung grundsätzlich interessant, wenn sie zu Ihrer Situation passt?"],
  ["„Wir haben bereits einen Anbieter“","Das ist großartig! Also ist Ihnen das Thema schon seit längerem wichtig, richtig? Ist es dann gestattet, gemeinsam einmal drüber zu schauen? Gestattet?"],
  ["„Wir machen das intern“","Das ist hervorragend. Unsere Beratung ergänzt oft bestehende Systeme. Ist es gestattet, gemeinsam in einem Termin darüber zu schauen? Gestattet?"],
  ["„Kein Budget“","Serie von „Also ist es Ihnen wichtig …“-Fragen: Prozedere passt zu Ausgaben / Budget soll steigen / Angebot 1:1 abstimmen. Danach den Termin pitchen."],
  ["„Zu komplex“","Also ist es Ihnen wichtig, dass Sie verstehen, wieso es funktioniert? Dass wir Sie komplett ausstatten, kein Hokuspokus? → Termin pitchen."],
  ["„Keine Priorität“","War das Thema schon einmal relevant bei Ihnen? Dann macht es Sinn, sich das in einem Termin näher anzuschauen, richtig?"],
  ["„Falscher Zeitpunkt“","Ist es Ihnen wichtig, dass wir zum richtigen Zeitpunkt durchkommen? Wann wäre dieser?"],
  ["„Falscher Ansprechpartner“","Könnten Sie mir sagen, wer bei Ihnen für die Optimierung von Vertriebsprozessen zuständig ist?"]]};

async function savePdf([name,b64]){const msg=$("dlm");
  const dl=window.claude?await window.claude.use("downloads"):null;
  if(!dl){msg.textContent="Download ist in dieser Ansicht nicht verfügbar.";return}
  const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  try{await dl.save({filename:name,data:new Blob([bytes])});msg.textContent="Gespeichert."}
  catch(err){msg.textContent=err&&err.code==="declined"?"Download abgebrochen.":err&&err.code==="rate_limited"?"Bitte kurz warten und nochmal klicken.":"Download ist gerade nicht möglich."}}

const DOC_CLOSING={pdf:["ApexFlux_Closing_Leitfaden.pdf",PDF_CLOSING],title:"Closing-Leitfaden (Gap Selling)",kind:"Leitfaden",intro:"Unser Ablauf für das 60-Minuten-Beratungsgespräch. Der Kunde kauft nicht unsere Leistungen, sondern das Schließen seiner Lücke zwischen heute und dem Ziel. Deine Aufgabe: die Lücke gemeinsam mit ihm sichtbar machen, in Euro beziffern und ApexFlux als Brücke zeigen.",
  merksatz:"Ist → Ziel → Lücke in € → Brücke → Preis → Kickoff",blocks:[
  ["Vorbereitung (vor dem Termin)","Meeting-Maske in monday lesen: Mitarbeiterzahl, Entscheider, Pain Points. Notiere deine Vermutung: Welche Lücke hat der Betrieb, und welche ein bis zwei Leistungssäulen passen dazu?"],
  ["Rahmen setzen (Minute 0–5)","„Mein Vorschlag: Sie erzählen mir zuerst, wie es bei Ihnen heute läuft. Dann zeige ich Ihnen, was wir konkret ändern würden. Und am Ende sagen wir uns beide ehrlich, ob es passt oder nicht. Einverstanden?“"],
  ["Ist-Zustand (Minute 5–25)","„Wie läuft ein Auftrag bei Ihnen heute von der Anfrage bis zur Rechnung?“ · „Wo geht dabei am meisten Zeit verloren?“ · „Wer macht das, und wie viele Stunden pro Woche?“ · „Was passiert, wenn etwas liegen bleibt?“ Bei jedem Problem nachhaken: „Und woran liegt das?“, bis du die eigentliche Ursache hast. Der Kunde redet mehr als du."],
  ["Zielzustand","„Angenommen, wir sitzen in sechs Monaten wieder hier und alles läuft: Was ist dann anders?“ · „Woran würden Sie merken, dass es sich gelohnt hat?“"],
  ["Lücke in Euro (Minute 25–30)","„Rechnen wir das kurz mit Ihren Zahlen.“ Stunden pro Woche × Personen × Stundensatz inkl. Nebenkosten × 48 Wochen = Kosten pro Jahr. Beispiel: 3 Std. × 2 Personen × 40 € × 48 = 11.520 € pro Jahr. Der Kunde nennt die Zahlen selbst, du schreibst mit und zeigst das Ergebnis."],
  ["Lösung als Brücke (Minute 30–40)","Zeige nur die Folien zu den Problemen, die er genannt hat, höchstens drei Punkte. Immer mit seinem Satz verbinden: „Sie sagten, Angebote dauern zu lange. So lösen wir genau das: …“"],
  ["Preis (etwa Minute 40)","„Die Investition liegt bei 9.900 € netto. Dem stehen nach Ihrer eigenen Rechnung [Betrag] € pro Jahr gegenüber.“ Danach schweigen und den Kunden zuerst reagieren lassen."],
  ["Einwände (Minute 40–55)","Mit einer Rückfrage antworten, nicht rechtfertigen (siehe Einwandbehandlung Closing). Risiko senken: klare Meilensteine, Abnahme je Phase. Ratenzahlung erst anbieten, wenn Nutzen und Planbarkeit geklärt sind."],
  ["Abschluss (Minute 55–60)","Kurz zusammenfassen: Lücke, Lösung, Plan. Dann: „Wollen wir den Kickoff fixieren, eher Dienstag oder Donnerstag?“ Auftragsbestätigung noch im Termin schicken."],
  ["Nachbereitung","Notizen und Ergebnis direkt in monday. Status setzen: Unterschrieben, oder Entscheidung offen mit Datum für die Wiedervorlage."]]};
const DOC_CLOSER_EINWAND={pdf:["ApexFlux_Einwandbehandlung_Closing.pdf",PDF_CLOSER],title:"Einwandbehandlung Closing",kind:"Leitfaden",intro:"Typische Einwände im Closing und die Frage-Techniken, mit denen du den Kunden aktiv in die Lösung einbeziehst.",
  merksatz:"Nach jedem Einwand eine konkrete nächste Handlung vorschlagen: Termin, Pilot oder Meilenstein.",blocks:[
  ["„Wir sind klein, ist das für uns relevant?“","Unsere Lösung ist flexibel und auch für kleinere Unternehmen ideal. Sie hilft, mit begrenzten Ressourcen effizienter zu arbeiten und sich auf Wachstum zu konzentrieren."],
  ["„Kommt unser Team mit der Technik zurecht?“","Unsere Lösung ist benutzerfreundlich, und wir bieten umfassende Schulungen, damit Ihr Team schnell und effektiv damit arbeitet."],
  ["„Passt KI zu unseren traditionellen Methoden?“","KI ergänzt traditionelle Methoden und macht sie effizienter, ohne den Kern zu verändern. Wir passen die Lösung an Ihre Arbeitsweise an."],
  ["„Leidet die persönliche Betreuung?“","Im Gegenteil: Automatisierung gibt Ihren Mitarbeitern mehr Zeit für persönliche Kundenbetreuung, weil Routineaufgaben schneller erledigt sind."],
  ["„Wie schnell sehen wir Resultate?“","Viele Kunden sehen schon nach wenigen Wochen Verbesserungen, weil die Lösung schnell einsatzbereit und auf ihre Prozesse abgestimmt ist."],
  ["„Ich möchte erst andere Anbieter vergleichen.“","Es ist sinnvoll, sich zu informieren. Lassen Sie uns gemeinsam die Punkte besprechen, die uns von anderen Anbietern abheben."],
  ["„Wir haben schlechte Erfahrungen gemacht.“","Ich verstehe Ihre Bedenken. Unsere umfassende Begleitung und maßgeschneiderte Lösung unterscheiden sich deutlich von Standardangeboten."],
  ["„Zu teuer“","„Woran messen Sie zu teuer konkret: am Gesamtbetrag, am Timing oder daran, dass der Nutzen noch nicht greifbar ist?“ · „Wenn wir heute 2–3 Kernprozesse finden, die X Stunden pro Woche sparen: Wären 9.900 € dann noch zu teuer?“"],
  ["„Zahlt sich das aus?“","„Was müsste messbar besser werden, damit Sie sagen: Hat sich gelohnt?“ · „Lassen Sie uns mit Ihren Zahlen rechnen: Was kostet Sie heute eine Stunde Admin-Aufwand?“"],
  ["„Funktioniert das nach zwei Wochen?“","„Was genau wollen Sie nach zwei Wochen sehen?“ · Wir definieren 1–2 Quick-Wins als Go-Live-Kriterium und einen klaren Umfang: Dann ist „funktioniert“ kein Gefühl, sondern eine Checkliste."],
  ["„Wer garantiert mir Planbarkeit?“","„Planbarkeit heißt für Sie: Zeitplan, Ergebnis oder Aufwand?“ · Ein Ergebnis ohne Mitwirkung kann ich nicht garantieren, aber das Risiko senken: Meilensteine, Abnahme pro Schritt, wöchentliche Reviews. „Meilenstein 1 nach 14 Tagen, und erst dann geben Sie Meilenstein 2 frei: Wäre das planbar genug?“"],
  ["„Das ist viel Geld auf einmal.“","„Was wäre ein Setup, bei dem Sie sich sicher fühlen: Teilzahlung, Abnahme je Phase oder ein Pilot auf einen Prozess?“ · „Wenn wir in drei Phasen gehen und Sie nach jeder Phase entscheiden: Reduziert das Ihr Risiko genug?“"],
  ["Ratenzahlung richtig platzieren","Erst nachdem Nutzen und Planbarkeit geklärt sind. 3 Raten à 3.300 €: Kickoff, Go-Live Quick-Win (ca. Tag 14), Abschluss und Abnahme (ca. Woche 4–6). Dann: „Wollen wir den Kickoff fixieren, Dienstag oder Donnerstag?“"]]};

    {id:"m1",roles:["setter","closer"],title:"ApexFlux & unser Angebot",
      goals:["Du kannst in zwei Sätzen erklären, was ApexFlux macht","Du kennst unser Projekt und wer den Termin mit dem Kunden führt"],
      videos:[
        {id:"v1",title:"Wer wir sind",dur:66,desc:"Was ApexFlux macht: Automatisierungen, KI-Lösungen und schlanke Abläufe für Handwerksbetriebe.",text:["Bevor du den ersten Anruf machst, musst du in zwei Sätzen sagen können, was ApexFlux eigentlich macht.", "Hier sind die zwei Sätze: ApexFlux bringt Ordnung in Handwerksbetriebe. Wir führen Automatisierungen, KI-Lösungen und schlanke Abläufe ein, damit Chef und Team weniger Zeit mit Papierkram verlieren.", "Wichtig dabei: Wir sind keine Berater, die schöne Folien abgeben und dann verschwinden. Wir setzen um. Und wir bleiben, bis es im Betrieb wirklich läuft.", "Unsere Arbeit steht auf vier Säulen. Erstens eine stabile IT-Grundlage. Zweitens Automatisierung, damit wiederkehrende Aufgaben von selbst laufen. Drittens ein sauberes CRM, damit keine Anfrage mehr verloren geht. Und viertens Schulungen, damit das Team die neuen Systeme selbst beherrscht.", "Für dich als Setter heißt das: Du musst keine Technik erklären. Du musst nur wissen, dass wir Zeit, Kosten und Nerven sparen. Alles Weitere erklärt der Chef im Termin."],src:"v1.mp4",req:true,noskip:true},
        {id:"v2",title:"Das Projekt für 9.900 €",dur:62,desc:"Leistungen, Ablauf und die Ratenzahlung mit 3 × 3.300 € netto.",text:["Jetzt schauen wir uns an, was der Kunde bei uns eigentlich kauft.", "Wir verkaufen ein Projekt, kein Abo. Die Investition liegt bei neuntausendneunhundert Euro netto, einmalig. Wer lieber in Raten zahlt, zahlt drei Mal dreitausenddreihundert Euro netto, gekoppelt an Meilensteine im Projekt.", "Der Ablauf ist immer gleich. Zuerst analysieren wir, wo im Betrieb die meiste Zeit verloren geht. Dann setzen wir die wichtigsten Lösungen um. Danach schulen wir das Team. Und wir bleiben dabei, bis alles stabil läuft.", "Und jetzt das Wichtigste für dich: Über den Preis sprichst du am Telefon nie. Nicht, weil er ein Geheimnis ist, sondern weil der Preis ohne den Nutzen keinen Sinn ergibt. Den Nutzen rechnet der Chef im Termin gemeinsam mit dem Kunden aus.", "Deine Aufgabe ist eine einzige: ein fester Termin mit dem Entscheider. Mehr nicht. Und genau das macht deinen Job so klar."],src:"v2.mp4",req:true,noskip:true}],
      quiz:[
        {type:"mc",q:"Was macht ApexFlux?",a:["Wir verkaufen Software-Lizenzen","Wir digitalisieren Handwerksbetriebe mit Automatisierungen, KI und schlanken Abläufen","Wir vermitteln Personal"],c:1},
        {type:"mc",q:"Welche Zahlungsarten gibt es für das Projekt?",a:["9.900 € netto einmalig oder 3 × 3.300 € netto","990 € im Monat","Der Preis wird am Telefon ausgehandelt"],c:0},
        {type:"mc",q:"Wer führt den Termin mit dem Kunden?",a:["Du als Setter","Unser Chef, Herr Kuzucuk","Ein Techniker"],c:1}]},
    {id:"m2",roles:["setter","closer"],title:"Zielgruppen",
      goals:["Du weißt, welche Betriebe wir anrufen und warum","Du erkennst die typischen Probleme im Handwerk"],
      videos:[
        {id:"v3",title:"Warum Handwerk?",dur:58,desc:"Wieso wir uns auf Handwerksbetriebe konzentrieren: Maler, Elektro, Dachdecker, Fliesenleger und mehr.",text:["Warum rufen wir eigentlich gezielt Handwerksbetriebe an?", "Ganz einfach: Im Handwerk ist die Lücke zwischen dem, was heute möglich ist, und dem, wie gearbeitet wird, besonders groß. Angebote werden von Hand geschrieben, Stunden auf Zetteln notiert, Anfragen landen in einem vollen Postfach.", "Gleichzeitig sind die Auftragsbücher voll und Fachkräfte knapp. Jede Stunde, die der Chef abends im Büro sitzt, fehlt auf der Baustelle oder in der Familie.", "Wir rufen Maler, Elektriker, Dachdecker, Fliesenleger, Sanitär- und Heizungsbetriebe und viele weitere Gewerke an. Am besten passen Betriebe, in denen der Chef noch selbst entscheidet und das Büro trotzdem schon über den Kopf wächst.", "Merk dir: Du sprichst mit Unternehmern, die hart arbeiten und wenig Zeit haben. Sei klar, sei respektvoll und komm auf den Punkt."],src:"v3.mp4",req:true,noskip:true},
        {id:"v4",title:"Die typischen Pain Points",dur:62,desc:"E-Mail-Chaos, Zeiterfassung, Aufmaße, Auftragsabwicklung: so erkennst du sie im Gespräch.",text:["Im Gespräch wirst du immer wieder dieselben Probleme hören. Wenn du sie erkennst, weißt du sofort: Hier passen wir.", "Problem eins: E-Mail-Chaos. Anfragen gehen im Postfach unter, Kunden warten tagelang auf eine Antwort, und manche Aufträge gehen einfach verloren.", "Problem zwei: Zeiterfassung und Aufmaße. Stundenzettel, Fotos, Notizen auf Papier. Am Ende der Woche sucht jemand alles zusammen und tippt es ab.", "Problem drei: Angebote und Rechnungen. Ein Angebot dauert Stunden, Rechnungen werden zu spät geschrieben, und das Geld kommt später als nötig.", "Problem vier: Alles hängt am Chef. Er ist Handwerker, Verkäufer, Buchhalter und Planer in einer Person. Abends und am Wochenende sitzt er am Schreibtisch.", "Wenn du einen dieser Sätze hörst, schreib ihn wörtlich in die Meeting-Maske. Genau damit bereitet sich der Chef auf den Termin vor."],src:"v4.mp4",req:true,noskip:true}],
      quiz:[
        {type:"mc",q:"Mit welchen Betrieben arbeiten wir vor allem?",a:["Großkonzerne","Handwerksbetriebe wie Maler, Elektro, Dachdecker und Fliesenleger","Privatpersonen"],c:1},
        {type:"fit",q:"Welche Probleme hören wir im Handwerk häufig?",items:[["E-Mails und Anfragen gehen unter",true],["Zeiterfassung und Aufmaße kosten zu viel Zeit",true],["Zu viel Werbung im Fernsehen",false],["Rechnungen werden zu spät geschrieben",true]]}]},
    {id:"m3",roles:["setter"],title:"Gesprächsleitfaden",
      goals:["Du kennst die Phasen eines Anrufs in der richtigen Reihenfolge","Du weißt, warum wir immer um Erlaubnis fragen („Gestattet?“)"],
      videos:[
        {id:"v5",title:"Der Ablauf eines Anrufs",dur:54,desc:"Durchstellen, Einstieg, Erlaubnis, Bedarfsfragen, Termin: der rote Faden jedes Gesprächs.",text:["Jeder Anruf folgt demselben roten Faden. Wenn du ihn kennst, verlierst du nie den Überblick.", "Schritt eins: Durchstellen lassen. Am Sekretariat bist du freundlich, klar und selbstverständlich.", "Schritt zwei: der Einstieg beim Chef. Du stellst dich vor und fragst um Erlaubnis, direkt auf den Punkt zu kommen.", "Schritt drei: offen sagen, was du willst, und um Erlaubnis für zwei, drei kurze Fragen bitten.", "Schritt vier: die Bedarfsfragen. Was ist ihm wichtig? Was noch? Und was am allermeisten?", "Schritt fünf: der Termin. Datum, Vormittag oder Nachmittag, Uhrzeit, E-Mail-Adresse und Bestätigung.", "Durchstellen, Einstieg, Erlaubnis, Fragen, Termin. Diese Reihenfolge änderst du nie. Auch nicht, wenn das Gespräch gut läuft."],src:"v5.mp4",req:true,noskip:true},
        {id:"v6",title:"Die Haltung: Gestattet?",dur:50,desc:"Warum wir offen sagen, was wir wollen, und vor jedem Schritt um Erlaubnis fragen.",text:["Ein Wort wirst du in unserem Skript ständig hören: Gestattet?", "Warum fragen wir so oft um Erlaubnis? Weil ein Unternehmer, der zustimmt, nicht mehr das Gefühl hat, überrumpelt zu werden. Er entscheidet selbst, dass das Gespräch weitergeht.", "Dazu kommt unsere zweite Haltung: Offenheit. Wir sagen klar, dass wir ihn als Kunden gewinnen wollen. Keine Tricks, kein Herumdrucksen. Das wirkt ehrlich, und Ehrlichkeit schafft Vertrauen.", "Und die dritte Haltung: Wir wollen nur dann einen Termin, wenn er dem Kunden wirklich etwas bringt. Das sagen wir auch so. Damit nimmst du jeden Druck aus dem Gespräch.", "Erlaubnis holen, offen sein, nur bei echtem Nutzen weitermachen. So klingst du nicht wie ein Verkäufer, sondern wie jemand, der hilft."],src:"v6.mp4",req:true,noskip:true}],
      quiz:[
        {type:"order",q:"Bring die Phasen eines Anrufs in die richtige Reihenfolge.",items:["Durchstellen lassen","Erlaubnis holen, auf den Punkt zu kommen","Bedarfsfragen stellen","Termin vereinbaren"]},
        {type:"mc",q:"Mit wem willst du sprechen?",a:["Mit dem Sekretariat","Mit dem Geschäftsführer","Mit dem Azubi"],c:1},
        {type:"mc",q:"Was ist das Ziel deines Anrufs?",a:["Das Projekt am Telefon verkaufen","Einen Termin mit unserem Chef vereinbaren","Eine Infomail verschicken"],c:1}]},
    {id:"m4",roles:["setter"],title:"Dein Skript",doc:DOC_SKRIPT,
      goals:["Du kannst jeden Skriptsatz der richtigen Stelle im Gespräch zuordnen","Du erkennst Sätze, die nicht in unser Skript gehören","Du führst den Kunden vom Bedarf zum festen Termin"],
      videos:[
        {id:"v7",title:"Durchstellen & Einstieg",dur:58,desc:"Vom Sekretariat bis „Ist es gestattet, die Katze aus dem Sack zu lassen?“",text:["Jetzt gehen wir das Skript Satz für Satz durch. Wir starten am Sekretariat.", "Dein Satz lautet: Wenn Sie mich gleich zum Geschäftsführer durchstellen, dann richten Sie ihm bitte aus, dass ich bereits in der Leitung warte. Danke, ich bleibe dann so lange dran.", "Du fragst nicht, ob du durchgestellt wirst. Du gehst selbstverständlich davon aus. Ruhig, freundlich und bestimmt.", "Dann hast du den Chef am Telefon. Du sagst: Guten Tag, Herr Müller, mein Name ist Lea Schmidt. Mit meinem Namen können Sie vermutlich noch nichts anfangen, nicht wahr? Und Sie fragen sich vielleicht, worum es geht, oder?", "Damit sprichst du aus, was er gerade denkt. Das nimmt die Spannung raus.", "Und jetzt der wichtigste Satz: Ist es gestattet, sofort auf den Punkt zu kommen und die Katze aus dem Sack zu lassen? Gestattet? Dann wartest du kurz, bis er ja sagt."]},
        {id:"v8",title:"Nutzen & Bedarfsfragen",dur:67,desc:"„Ich bin ganz offen …“ und die drei Fragen: Was ist wichtig? Was noch? Was am meisten?",text:["Der Chef hat ja gesagt. Jetzt kommt der Teil, in dem du ganz offen bist.", "Du sagst: Ich bin ganz offen, ich möchte Sie gerne als neuen Kunden gewinnen. Danach sagst du in einem Satz, worum es geht: Automatisierungen, KI-Lösungen und schlanke Abläufe, die Zeit, Kosten und Nerven sparen. Aber nur dann, wenn er dadurch deutlich besser fährt als heute.", "Dann holst du dir die nächste Erlaubnis: Ist es gestattet, Ihnen hierzu zwei, drei kurze Fragen zu stellen? Gestattet?", "Erste Frage: Angenommen, Sie würden gezielt Automatisierungen einführen, was wäre Ihnen dabei besonders wichtig?", "Zweite Frage: Was ist Ihnen darüber hinaus noch wichtig?", "Dritte Frage: Welcher dieser Punkte ist Ihnen am allermeisten wichtig?", "Und jetzt der Profi-Tipp: Hör zu und schreib mit. Was der Kunde hier sagt, ist Gold für den Chef im Termin. Unterbrich nicht und bewerte nichts."]},
        {id:"v9",title:"Vom Skript zum Termin",dur:62,desc:"„Wäre es naiv und töricht gewesen …“, Termin, E-Mail, Bestätigung und Verabschiedung.",text:["Jetzt führst du den Kunden vom Bedarf zum festen Termin.", "Du fasst zusammen und fragst: Angenommen, wir finden genau die Lösungen, die bei Ihnen den größten Hebel haben. Wäre es dann vollkommen naiv und töricht gewesen, eine halbe Stunde Zeit zu investieren und unser Angebot zu prüfen? Darauf sagt fast jeder: Nein.", "Dann gehst du direkt in den Termin: Was ist denn der Donnerstag für ein Tag bei Ihnen? Passt es eher am Vormittag oder am Nachmittag? Und dann lieber um zehn oder um elf Uhr?", "Du gibst immer zwei Möglichkeiten. Nie eine offene Frage wie: Wann passt es Ihnen?", "Danach fragst du nach der E-Mail-Adresse für die Terminbestätigung. Und dann eine letzte Frage: Auf was freuen Sie sich bei unserem Treffen am allermeisten?", "Zum Schluss bittest du ihn, kurz in seine Mails zu schauen und den Termin zu bestätigen. Erst dann ist der Termin wirklich fest. Und erst dann trägst du ihn in monday ein."]}],
      quiz:[
        {type:"assign",q:"„Ist es gestattet, sofort auf den Punkt zu kommen und die Katze aus dem Sack zu lassen?“ Wann sagst du diesen Satz?",a:["Direkt nach der Begrüßung des Geschäftsführers","Bei der Terminvereinbarung","Beim Sekretariat"],c:0},
        {type:"assign",q:"„… dann richten Sie bitte aus, dass [dein Name] bereits in der Leitung wartet.“ Wann sagst du diesen Satz?",a:["Beim Geschäftsführer","Beim Sekretariat, damit du durchgestellt wirst","Ganz am Ende"],c:1},
        {type:"assign",q:"„Was ist denn der [Datum] für ein Tag bei Ihnen? Passt es Ihnen besser am Vormittag oder am Nachmittag?“ Wann sagst du diesen Satz?",a:["Gleich nach der Begrüßung","Nachdem der Kunde bestätigt hat, dass ein Treffen keine Zeitverschwendung wäre","Nachdem du die E-Mail-Adresse hast"],c:1},
        {type:"fit",q:"Gehört der Satz in unser Skript?",items:[["„Ich möchte Sie gerne als neuen Kunden gewinnen.“",true],["„Nur heute: 20 % Rabatt, wenn Sie jetzt zusagen.“",false],["„Was wäre Ihnen dabei besonders wichtig? Worauf würden Sie achten?“",true],["„Das kostet 9.900 Euro, sind Sie dabei?“",false],["„Auf was freuen Sie sich während unseres Treffens am allermeisten?“",true]]},
        {type:"order",q:"Bring das Ende des Gesprächs in die richtige Reihenfolge.",items:["Datum und Uhrzeit festlegen","Nach der E-Mail-Adresse für die Bestätigung fragen","„Auf was freuen Sie sich am allermeisten?“","Den Kunden die Bestätigungsmail annehmen lassen"]}]},
    {id:"m5",roles:["setter","closer"],title:"Einwandbehandlung",doc:DOC_EINWAND,
      goals:["Du behandelst einen Einwand als Anlass für eine Rückfrage, nicht als Absage","Du kennst unsere Antwort auf alle 10 Standard-Einwände","Du kennst den Merksatz: Einwand → Rückfrage → Bedarf → nächster Schritt"],
      videos:[
        {id:"e0",title:"Das Grundprinzip",dur:50,desc:"Nicht diskutieren, nicht rechtfertigen, nicht überreden. Den echten Grund verstehen und den nächsten Schritt vereinbaren.",text:["Einwände gehören zu jedem Anruf. Sie sind kein Nein. Sie sind ein Zeichen, dass der Kunde noch nicht genug weiß.", "Deshalb gilt bei uns: nicht diskutieren, nicht rechtfertigen, nicht überreden.", "Stattdessen stellst du eine kurze Rückfrage. Damit verstehst du den echten Grund hinter dem Einwand.", "Unser Merksatz hat vier Schritte: Einwand, Rückfrage, Bedarf, nächster Schritt.", "Ein Beispiel: Der Kunde sagt, er hat keine Zeit. Du sagst: Also ist es Ihnen wichtig, dass ich direkt auf den Punkt komme? Und schon bist du wieder im Gespräch.", "In den nächsten Lektionen lernst du unsere Antwort auf die zehn häufigsten Einwände. Lern sie so gut, dass du nicht mehr nachdenken musst."]},
        {id:"e1",title:"„Kein Interesse“",dur:180,desc:"„Das verstehe ich, an dieser Stelle wissen Sie ja auch noch gar nicht, worum es geht …“",text:["Der häufigste Einwand: Kein Interesse.", "Das ist meistens ein Reflex. Der Kunde weiß noch gar nicht, worum es geht. Also kann er auch kein echtes Desinteresse haben.", "Deine Antwort: Das verstehe ich. An dieser Stelle wissen Sie ja auch noch gar nicht, worum es überhaupt geht. Genau deshalb rufe ich nicht an, um Ihnen etwas zu verkaufen, sondern um mit Ihnen in zwei, drei kurzen Fragen herauszufinden, ob sich ein Gespräch überhaupt lohnt. Ist es gestattet? Gestattet?", "Damit nimmst du den Druck raus und holst dir eine neue Erlaubnis. Danach gehst du direkt zu den Bedarfsfragen."]},
        {id:"e2",title:"„Ich habe keine Zeit“",dur:150,desc:"„Ich verstehe, dass Sie beschäftigt sind. Also ist es Ihnen wichtig, dass ich die Katze aus dem Sack lasse?“",text:["Der Kunde sagt: Ich habe keine Zeit.", "Das stimmt fast immer. Handwerker haben wirklich wenig Zeit. Genau deshalb hilft hier keine lange Erklärung.", "Deine Antwort: Ich verstehe, dass Sie beschäftigt sind. Also ist es Ihnen wichtig, dass ich die Katze aus dem Sack lasse? Ist das gestattet?", "Du machst aus dem Einwand einen Wunsch: Er will es kurz. Also machst du es kurz. Nach seinem Ja kommst du in einem Satz auf den Punkt."]},
        {id:"e3",title:"„Schicken Sie mir Infos per Mail“",dur:170,desc:"„Gerne, nur damit wir beide unsere Zeit nicht verschwenden …“",text:["Der Kunde sagt: Schicken Sie mir doch einfach Infos per Mail.", "Vorsicht, das ist oft ein höfliches Nein. Eine Mail wird selten gelesen, und der Kunde ist danach weg.", "Deine Antwort: Gerne. Nur damit wir beide unsere Zeit nicht verschwenden: Geht es Ihnen gerade darum, erstmal Informationen zu sammeln, oder wäre eine Lösung grundsätzlich interessant, wenn sie zu Ihrer Situation passt?", "Damit findest du heraus, ob echtes Interesse da ist. Wenn ja, gehst du zu den Bedarfsfragen. Wenn nein, hast du ehrlich Klarheit und verlierst keine Zeit."]},
        {id:"e4",title:"„Wir haben bereits einen Anbieter“",dur:160,desc:"„Das ist großartig! Also ist Ihnen das Thema schon seit längerem wichtig, richtig?“",text:["Der Kunde sagt: Wir haben bereits einen Anbieter.", "Das ist eigentlich eine gute Nachricht. Es heißt: Das Thema ist ihm wichtig.", "Deine Antwort: Das ist großartig! Also ist Ihnen das Thema schon seit längerem wichtig, richtig? Ist es dann gestattet, gemeinsam einmal drüber zu schauen? Gestattet?", "Du greifst den Anbieter nie an. Du bestätigst den Kunden und bietest einen zweiten Blick an. Das ist für ihn ohne Risiko."]},
        {id:"e5",title:"„Wir machen das intern“",dur:150,desc:"„Das ist hervorragend. Unsere Beratung ergänzt oft bestehende Systeme …“",text:["Der Kunde sagt: Das machen wir intern.", "Auch hier gilt: Er hat sich schon Gedanken gemacht. Das ist ein gutes Zeichen.", "Deine Antwort: Das ist hervorragend. Unsere Beratung ergänzt oft bestehende Systeme. Ist es gestattet, gemeinsam in einem Termin darüber zu schauen? Gestattet?", "Wir wollen nichts ersetzen, was funktioniert. Wir schauen, wo noch Zeit liegen bleibt. So bleibt der Stolz auf die eigene Lösung erhalten, und die Tür bleibt offen."]},
        {id:"e6",title:"„Kein Budget“",dur:200,desc:"Eine Serie von „Also ist es Ihnen wichtig …“-Fragen, danach den Termin pitchen.",text:["Der Kunde sagt: Dafür haben wir kein Budget.", "Am Telefon diskutierst du nie über Geld. Du hast den Preis ja noch gar nicht genannt, und das tust du auch nicht.", "Stattdessen stellst du eine Reihe kurzer Fragen, die mit „Also ist es Ihnen wichtig“ beginnen. Zum Beispiel: Also ist es Ihnen wichtig, dass sich jede Ausgabe auch rechnet? Also ist es Ihnen wichtig, dass am Ende mehr Geld übrig bleibt als vorher? Und also ist es Ihnen wichtig, dass ein Angebot genau zu Ihrem Betrieb passt?", "Jedes Ja zeigt: Er will kein Geld ausgeben, das sich nicht lohnt. Genau darum geht es im Termin. Danach schlägst du den Termin vor."]},
        {id:"e7",title:"„Zu komplex“",dur:160,desc:"„Also ist es Ihnen wichtig, dass Sie verstehen, wieso es funktioniert?“",text:["Der Kunde sagt: Das ist mir zu komplex.", "Dahinter steckt meist eine Sorge: Er hat Angst, etwas zu kaufen, das am Ende keiner im Betrieb bedienen kann.", "Deine Antwort: Also ist es Ihnen wichtig, dass Sie verstehen, wieso es funktioniert? Und dass wir Sie und Ihr Team komplett ausstatten, ohne Hokuspokus?", "Damit sprichst du seine Sorge offen an. Und genau das zeigt der Chef im Termin: einfach, verständlich und mit Schulung. Danach schlägst du den Termin vor."]},
        {id:"e8",title:"„Keine Priorität“",dur:150,desc:"„War das Thema schon einmal relevant bei Ihnen?“",text:["Der Kunde sagt: Das hat bei uns gerade keine Priorität.", "Hier fragst du nach der Vergangenheit: War das Thema schon einmal relevant bei Ihnen?", "Fast jeder Handwerker hatte schon einmal einen Moment, in dem ihm Büroarbeit über den Kopf gewachsen ist. Sagt er ja, antwortest du: Dann macht es doch Sinn, sich das in einem Termin einmal genauer anzuschauen, richtig?", "So erinnert er sich selbst an das Problem. Du musst ihn nicht überzeugen."]},
        {id:"e9",title:"„Falscher Zeitpunkt“",dur:140,desc:"„Ist es Ihnen wichtig, dass wir zum richtigen Zeitpunkt durchkommen? Wann wäre dieser?“",text:["Der Kunde sagt: Gerade ist ein schlechter Zeitpunkt.", "Nimm das ernst. Vielleicht steht er gerade auf der Baustelle oder mitten in der Hochsaison.", "Deine Antwort: Ist es Ihnen wichtig, dass wir zum richtigen Zeitpunkt durchkommen? Wann wäre dieser?", "Nennt er einen Zeitpunkt, trägst du ihn sofort als Wiedervorlage in monday ein. Mit Datum und einer kurzen Notiz. So rufst du genau dann wieder an, wenn er Zeit hat."]},
        {id:"e10",title:"„Falscher Ansprechpartner“",dur:130,desc:"„Könnten Sie mir sagen, wer bei Ihnen für die Optimierung von Vertriebsprozessen zuständig ist?“",text:["Der Kunde sagt: Da bin ich der falsche Ansprechpartner.", "Kein Problem. Das ist sogar eine Chance, direkt beim Richtigen zu landen.", "Deine Frage: Könnten Sie mir sagen, wer bei Ihnen für die Optimierung von Vertriebsprozessen zuständig ist?", "Notiere dir den Namen und, wenn möglich, die Durchwahl in monday. Beim nächsten Anruf nennst du den Namen am Sekretariat. Dann wirst du viel leichter durchgestellt."]}],
      quiz:[
        {type:"mc",q:"Wie behandelst du einen Einwand?",a:["Diskutieren, bis der Kunde überzeugt ist","Als Anlass für eine kurze Rückfrage","Höflich auflegen"],c:1},
        {type:"order",q:"Bring den Merksatz in die richtige Reihenfolge.",items:["Einwand","Rückfrage","Bedarf","Nächster Schritt"]},
        {type:"assign",q:"Der Kunde sagt: „Ich habe keine Zeit.“ Welche Antwort ist unsere?",a:["„Dauert nur fünf Minuten, versprochen.“","„Ich verstehe, dass Sie beschäftigt sind. Also ist es Ihnen wichtig, dass ich die Katze aus dem Sack lasse? Ist das gestattet?“","„Dann rufe ich morgen wieder an.“"],c:1},
        {type:"assign",q:"Der Kunde sagt: „Wir haben bereits einen Anbieter.“ Welche Antwort ist unsere?",a:["„Das ist großartig! Also ist Ihnen das Thema schon seit längerem wichtig, richtig? Ist es dann gestattet, gemeinsam einmal drüber zu schauen?“","„Wir sind aber günstiger.“","„Schade, dann einen schönen Tag noch.“"],c:0},
        {type:"fit",q:"Passt die Antwort zum Einwand?",items:[["„Schicken Sie mir Infos per Mail“ → „Gerne, nur damit wir beide unsere Zeit nicht verschwenden: Geht es Ihnen gerade darum, erstmal Informationen zu sammeln?“",true],["„Kein Interesse“ → „Okay, dann entschuldigen Sie die Störung.“",false],["„Falscher Zeitpunkt“ → „Ist es Ihnen wichtig, dass wir zum richtigen Zeitpunkt durchkommen? Wann wäre dieser?“",true],["„Falscher Ansprechpartner“ → „Dann stellen Sie mich bitte einfach durch.“",false]]}]},
    {id:"m6",roles:["closer"],title:"Das Closing-Meeting",doc:DOC_CLOSING,
      goals:["Du führst jeden Termin nach dem Gap-Selling-Ablauf: Ist, Ziel, Lücke, Brücke, Preis, Kickoff","Du rechnest die Lücke mit den Zahlen des Kunden in Euro aus","Du nennst den Preis im ersten Termin und schließt mit einer Alternativfrage ab"],
      videos:[{"id":"c1","title":"Prinzip & Vorbereitung","dur":0,"desc":"Der Kunde kauft das Schließen seiner Lücke, nicht unsere Leistungen. So bereitest du dich vor und setzt den Rahmen.","note":{"type":"info","text":"Aus der Forschung: Gap Selling (Keenan) stellt das Problem des Kunden in den Mittelpunkt, nicht das Produkt."},"text":["Unser Ablauf für das 60-Minuten-Beratungsgespräch. Der Kunde kauft nicht unsere Leistungen, sondern das Schließen seiner Lücke zwischen heute und dem Ziel. Deine Aufgabe: die Lücke gemeinsam mit ihm sichtbar machen, in Euro beziffern und ApexFlux als Brücke zeigen.","> Merksatz: Ist, Ziel, Lücke in €, Brücke, Preis, Kickoff","## Vorbereitung (vor dem Termin)","Meeting-Maske in monday lesen: Mitarbeiterzahl, Entscheider, Pain Points. Notiere deine Vermutung: Welche Lücke hat der Betrieb, und welche ein bis zwei Leistungssäulen passen dazu?","## Rahmen setzen (Minute 0–5)","„Mein Vorschlag: Sie erzählen mir zuerst, wie es bei Ihnen heute läuft. Dann zeige ich Ihnen, was wir konkret ändern würden. Und am Ende sagen wir uns beide ehrlich, ob es passt oder nicht. Einverstanden?“"]},{"id":"c2","title":"Ist-Zustand & Lücke in Euro","dur":0,"desc":"Minute 5–30: verstehen, wo der Betrieb Zeit und Geld verliert, und die Lücke mit seinen Zahlen ausrechnen.","note":{"type":"info","text":"Aus der Forschung: Das beste Redeverhältnis in über 25.000 B2B-Gesprächen lag bei 43:57. Der Kunde redet mehr (Gong Labs)."},"text":["## Ist-Zustand (Minute 5–25)","„Wie läuft ein Auftrag bei Ihnen heute von der Anfrage bis zur Rechnung?“ · „Wo geht dabei am meisten Zeit verloren?“ · „Wer macht das, und wie viele Stunden pro Woche?“ · „Was passiert, wenn etwas liegen bleibt?“ Bei jedem Problem nachhaken: „Und woran liegt das?“, bis du die eigentliche Ursache hast. Der Kunde redet mehr als du.","## Zielzustand","„Angenommen, wir sitzen in sechs Monaten wieder hier und alles läuft: Was ist dann anders?“ · „Woran würden Sie merken, dass es sich gelohnt hat?“","## Lücke in Euro (Minute 25–30)","„Rechnen wir das kurz mit Ihren Zahlen.“ Stunden pro Woche × Personen × Stundensatz inkl. Nebenkosten × 48 Wochen = Kosten pro Jahr. Beispiel: 3 Std. × 2 Personen × 40 € × 48 = 11.520 € pro Jahr. Der Kunde nennt die Zahlen selbst, du schreibst mit und zeigst das Ergebnis."]},{"id":"c3","title":"Lösung & Preis","dur":0,"desc":"Minute 30–40: nur die passenden Folien zeigen und 9.900 € gegen die Jahreskosten stellen.","note":{"type":"info","text":"Aus der Forschung: Top-Verkäufer nennen den Preis etwa ab Minute 38–46 im ersten Gespräch. Abschlussquote 42 % mit, 5 % ohne Preis im ersten Call (Gong Labs, Zusammenhang)."},"text":["## Lösung als Brücke (Minute 30–40)","Zeige nur die Folien zu den Problemen, die er genannt hat, höchstens drei Punkte. Immer mit seinem Satz verbinden: „Sie sagten, Angebote dauern zu lange. So lösen wir genau das: …“","## Preis (etwa Minute 40)","„Die Investition liegt bei 9.900 € netto. Dem stehen nach Ihrer eigenen Rechnung [Betrag] € pro Jahr gegenüber.“ Danach schweigen und den Kunden zuerst reagieren lassen."]},{"id":"c4","title":"Einwände & Abschluss","dur":0,"desc":"Minute 40–60: Einwände mit Rückfragen lösen, den Kickoff fixieren und sauber nachbereiten.","note":{"type":"info","text":"Aus der Forschung: Sprache, die dem Kunden Risiko abnimmt, ging mit 32 % höheren Abschlussquoten einher (Gong Labs)."},"text":["## Einwände (Minute 40–55)","Mit einer Rückfrage antworten, nicht rechtfertigen (siehe Einwandbehandlung Closing). Risiko senken: klare Meilensteine, Abnahme je Phase. Ratenzahlung erst anbieten, wenn Nutzen und Planbarkeit geklärt sind.","## Abschluss (Minute 55–60)","Kurz zusammenfassen: Lücke, Lösung, Plan. Dann: „Wollen wir den Kickoff fixieren, eher Dienstag oder Donnerstag?“ Auftragsbestätigung noch im Termin schicken.","## Nachbereitung","Notizen und Ergebnis direkt in monday. Status setzen: Unterschrieben, oder Entscheidung offen mit Datum für die Wiedervorlage."]}],

      videos:[{"id":"ce1","title":"Die 7 klassischen Einwände","dur":0,"desc":"Klein, Technik, KI, Betreuung, Resultate, Vergleich, schlechte Erfahrungen.","text":["Typische Einwände im Closing und die Frage-Techniken, mit denen du den Kunden aktiv in die Lösung einbeziehst.","## „Wir sind klein, ist das für uns relevant?“","Unsere Lösung ist flexibel und auch für kleinere Unternehmen ideal. Sie hilft, mit begrenzten Ressourcen effizienter zu arbeiten und sich auf Wachstum zu konzentrieren.","## „Kommt unser Team mit der Technik zurecht?“","Unsere Lösung ist benutzerfreundlich, und wir bieten umfassende Schulungen, damit Ihr Team schnell und effektiv damit arbeitet.","## „Passt KI zu unseren traditionellen Methoden?“","KI ergänzt traditionelle Methoden und macht sie effizienter, ohne den Kern zu verändern. Wir passen die Lösung an Ihre Arbeitsweise an.","## „Leidet die persönliche Betreuung?“","Im Gegenteil: Automatisierung gibt Ihren Mitarbeitern mehr Zeit für persönliche Kundenbetreuung, weil Routineaufgaben schneller erledigt sind.","## „Wie schnell sehen wir Resultate?“","Viele Kunden sehen schon nach wenigen Wochen Verbesserungen, weil die Lösung schnell einsatzbereit und auf ihre Prozesse abgestimmt ist.","## „Ich möchte erst andere Anbieter vergleichen.“","Es ist sinnvoll, sich zu informieren. Lassen Sie uns gemeinsam die Punkte besprechen, die uns von anderen Anbietern abheben.","## „Wir haben schlechte Erfahrungen gemacht.“","Ich verstehe Ihre Bedenken. Unsere umfassende Begleitung und maßgeschneiderte Lösung unterscheiden sich deutlich von Standardangeboten."]},{"id":"ce2","title":"Preis & ROI","dur":0,"desc":"Rückfrage statt Rabatt, und mit den Zahlen des Kunden rechnen.","text":["## „Zu teuer“","„Woran messen Sie zu teuer konkret: am Gesamtbetrag, am Timing oder daran, dass der Nutzen noch nicht greifbar ist?“ · „Wenn wir heute 2–3 Kernprozesse finden, die X Stunden pro Woche sparen: Wären 9.900 € dann noch zu teuer?“","## „Zahlt sich das aus?“","„Was müsste messbar besser werden, damit Sie sagen: Hat sich gelohnt?“ · „Lassen Sie uns mit Ihren Zahlen rechnen: Was kostet Sie heute eine Stunde Admin-Aufwand?“"]},{"id":"ce3","title":"Umsetzung, Planbarkeit & Risiko","dur":0,"desc":"Quick-Wins als Checkliste, Meilensteine statt Garantien, Sicherheit statt Druck.","text":["## „Funktioniert das nach zwei Wochen?“","„Was genau wollen Sie nach zwei Wochen sehen?“ · Wir definieren 1–2 Quick-Wins als Go-Live-Kriterium und einen klaren Umfang: Dann ist „funktioniert“ kein Gefühl, sondern eine Checkliste.","## „Wer garantiert mir Planbarkeit?“","„Planbarkeit heißt für Sie: Zeitplan, Ergebnis oder Aufwand?“ · Ein Ergebnis ohne Mitwirkung kann ich nicht garantieren, aber das Risiko senken: Meilensteine, Abnahme pro Schritt, wöchentliche Reviews. „Meilenstein 1 nach 14 Tagen, und erst dann geben Sie Meilenstein 2 frei: Wäre das planbar genug?“","## „Das ist viel Geld auf einmal.“","„Was wäre ein Setup, bei dem Sie sich sicher fühlen: Teilzahlung, Abnahme je Phase oder ein Pilot auf einen Prozess?“ · „Wenn wir in drei Phasen gehen und Sie nach jeder Phase entscheiden: Reduziert das Ihr Risiko genug?“"]},{"id":"ce4","title":"Ratenzahlung & Kickoff","dur":0,"desc":"Raten erst nach geklärter Sicherheit, dann direkt den Kickoff fixieren.","text":["## Ratenzahlung richtig platzieren","Erst nachdem Nutzen und Planbarkeit geklärt sind. 3 Raten à 3.300 €: Kickoff, Go-Live Quick-Win (ca. Tag 14), Abschluss und Abnahme (ca. Woche 4–6). Dann: „Wollen wir den Kickoff fixieren, Dienstag oder Donnerstag?“","> Nach jedem Einwand eine konkrete nächste Handlung vorschlagen: Termin, Pilot oder Meilenstein."]}],

function drawFoot(u,s){const w=u.w[s.id]||0,d=done(u,s),can=!s.v.req||w>=S.cfg.watch||isText(s.v);

function bump(u,s,val,dt){u.log=u.log||{};const dk=dayKey(Date.now());u.log[dk]=(u.log[dk]||0)+dt;u.w[s.id]=Math.max(u.w[s.id]||0,Math.min(100,Math.round(val)));u.time=(u.time||0)+dt;drawFoot(u,s)}

  if(v.src){sc.innerHTML=`<video id="vp" src="${v.src}" controls playsinline></video>`;const vp=$("vp");vp.playbackRate=+prefs(u).speed||1;let maxT=0,lastT=0;
    vp.ontimeupdate=()=>{const t=vp.currentTime;if(t>lastT&&t-lastT<2)u.time=(u.time||0)+(t-lastT);lastT=t;maxT=Math.max(maxT,t);if(vp.duration)bump(u,s,maxT/vp.duration*100,0)};

const TYPE_LABEL={mc:"Multiple Choice · eine Antwort",assign:"Satz zuordnen · wähle die richtige Stelle",fit:"Ja oder Nein · für jeden Satz",order:"Reihenfolge · vergib die Nummern"};
const perm=n=>[...Array(n).keys()].sort((x,y)=>((x*3+1)%n)-((y*3+1)%n));
function drawQuiz(u,s){
  const Q=s.m.quiz, r=S.qres, need=Math.ceil(S.cfg.pass/100*Q.length), passed=!!u.q[s.id], dis=passed?"disabled":"";
  $("lc").innerHTML=`<div class="lbl">${esc(s.m.title)}</div><h2>Modul-Quiz</h2><div class="box info">${Q.length} Fragen. Mindestens ${need} richtig, dann ist das nächste Modul frei.</div>
    <form class="quiz q" id="qf">${Q.map((x,i)=>{
      const head=`<legend>${i+1}. ${esc(x.q)}</legend><div class="qtype">${TYPE_LABEL[x.type]}</div>`;
      if(x.type==="mc"||x.type==="assign")return `<fieldset>${head}${x.a.map((o,j)=>`<label class="${r?(j===x.c?"right":(r.ans[i]===j?"wrong":"")):""}"><input type="radio" name="q${i}" value="${j}" ${r&&r.ans[i]===j?"checked":""} ${dis}> <span>${esc(o)}</span></label>`).join("")}</fieldset>`;
      if(x.type==="fit")return `<fieldset>${head}${x.items.map(([t,v],k)=>{const a=r?r.ans[i][k]:null;return `<div class="yn ${r?(a===v?"right":"wrong"):""}"><span>${esc(t)}</span><span class="ynb"><label><input type="radio" name="q${i}_${k}" value="1" ${a===true?"checked":""} ${dis}> Ja</label><label><input type="radio" name="q${i}_${k}" value="0" ${a===false?"checked":""} ${dis}> Nein</label></span></div>`}).join("")}</fieldset>`;
      return `<fieldset>${head}${perm(x.items.length).map(k=>{const a=r?r.ans[i][k]:null;return `<div class="yn ${r?(a===k+1?"right":"wrong"):""}"><span>${esc(x.items[k])}</span><select id="q${i}_${k}" aria-label="Position" ${dis}><option value="">–</option>${x.items.map((_,n)=>`<option ${a===n+1?"selected":""}>${n+1}</option>`).join("")}</select>${r&&a!==k+1?`<span class="muted" style="font-size:12px">richtig: ${k+1}</span>`:""}</div>`}).join("")}</fieldset>`;
    }).join("")}
    <p id="qmsg" class="msg ${r?(r.ok?"ok":"warn"):""}" ${r||passed?"":"hidden"}>${passed&&!r?"Bestanden.":r?(r.ok?`${r.score} von ${Q.length} richtig. Bestanden, das nächste Modul ist frei.`:`${r.score} von ${Q.length} richtig. Schau dir die Videos nochmal an und versuch es erneut.`):""}</p>
    <div class="lfoot"><span></span>${passed?`<button class="btn primary" type="button" id="qnext">Weiter ›</button>`:`<button class="btn primary" type="submit">${r&&!r.ok?"Nochmal versuchen":"Antworten prüfen"}</button>`}</div></form>`;
  if($("qnext"))$("qnext").onclick=()=>{S.qres=null;const a=steps(u),i=a.findIndex(x=>x.id===s.id);if(a[i+1])goLesson(a[i+1].id);else{S.page="dash";render()}};
  $("qf").onsubmit=e=>{e.preventDefault();
    if(S.qres&&!S.qres.ok){S.qres=null;return drawQuiz(u,s)}
    let missing=false;
    const ans=Q.map((x,i)=>{
      if(x.type==="mc"||x.type==="assign"){const c=document.querySelector(`input[name=q${i}]:checked`);if(!c)missing=true;return c?+c.value:null}
      if(x.type==="fit")return x.items.map((_,k)=>{const c=document.querySelector(`input[name=q${i}_${k}]:checked`);if(!c)missing=true;return c?c.value==="1":null});
      return x.items.map((_,k)=>{const v=$(`q${i}_${k}`).value;if(!v)missing=true;return v?+v:null})});
    if(missing){const q=$("qmsg");q.textContent="Beantworte bitte alle Fragen und Sätze.";q.className="msg warn";q.hidden=false;return}
    const right=Q.map((x,i)=>x.type==="mc"||x.type==="assign"?ans[i]===x.c:x.type==="fit"?x.items.every(([_,v],k)=>ans[i][k]===v):x.items.every((_,k)=>ans[i][k]===k+1));
    const score=right.filter(Boolean).length, ok=score>=need, before=pct(u);
    if(!u.q[s.id]){u.qa=u.qa||{};const qa=u.qa[s.id]||{n:0,best:0};qa.n++;qa.best=Math.max(qa.best,Math.round(score/Q.length*100));u.qa[s.id]=qa}
    S.qres={ans,score,ok};
    if(ok){u.q[s.id]=1;const after=pct(u);toast(beltFor(after)!==beltFor(before)?`Neuer Gürtel: ${beltFor(after)[0]}gurt`:"Quiz bestanden")}
    lesson()};
}

function audit(what){S.cfg.audit.unshift({when:new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}),who:S.user.name,what})}
function shade(hex,f){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.round(v*f));return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("")}
function applyCfg(){const r=document.documentElement.style;r.setProperty("--accent",S.cfg.accent);r.setProperty("--accent-ink",shade(S.cfg.accent,.62));const n=parseInt(S.cfg.accent.slice(1),16),L=(0.2126*(n>>16)+0.7152*(n>>8&255)+0.0722*(n&255))/255;r.setProperty("--on-accent",L<0.55?"#ffffff":"#231204");document.title=S.cfg.name+" "+S.cfg.sub}
const brandHTML=()=>S.cfg.logo?`<img class="blogo" src="${S.cfg.logo}" alt="${esc(S.cfg.name)}">`:`<b>${esc(S.cfg.name)}</b><span>${esc(S.cfg.sub)}</span>`;

/* Formular-Bausteine: data-k bindet ein Feld an S.cfg */
const fText=(k,label,hint,type="text")=>`<div class="srow"><div class="sl"><label for="c-${k}">${label}</label>${hint?`<small>${hint}</small>`:""}</div><div class="sv"><input id="c-${k}" type="${type}" data-k="${k}" value="${esc(S.cfg[k]??"")}"></div></div>`;
const fNum=(k,label,hint,min,max,unit)=>`<div class="srow"><div class="sl"><label for="c-${k}">${label}</label>${hint?`<small>${hint}</small>`:""}</div><div class="sv"><span class="numin"><input id="c-${k}" type="number" min="${min}" max="${max}" data-k="${k}" data-num value="${S.cfg[k]}"><span>${unit}</span></span></div></div>`;
const fTog=(k,label,hint)=>`<div class="srow"><div class="sl"><label for="c-${k}">${label}</label>${hint?`<small>${hint}</small>`:""}</div><div class="sv"><label class="switch"><input id="c-${k}" type="checkbox" data-k="${k}" ${S.cfg[k]?"checked":""}><span></span></label></div></div>`;
const fSel=(k,label,opts,hint)=>`<div class="srow"><div class="sl"><label for="c-${k}">${label}</label>${hint?`<small>${hint}</small>`:""}</div><div class="sv"><select id="c-${k}" data-k="${k}">${opts.map(([v,t])=>`<option value="${v}" ${S.cfg[k]===v?"selected":""}>${t}</option>`).join("")}</select></div></div>`;
const sec=(title,desc,body)=>`<section class="card ssec"><div class="sh"><h3>${title}</h3>${desc?`<p class="muted">${desc}</p>`:""}</div>${body}</section>`;

  (isOwner()?sec("KI-Anbieter (nur für dich)","Für den KI-Baukasten. Kunden sehen diesen Bereich nie.",
   `<div class="srow"><div class="sl"><label for="ai-prov">Anbieter</label><small>${esc((AI_PROV.find(p=>p[0]===S.platform.ai.provider)||AI_PROV[0])[2])}</small></div><div class="sv"><select id="ai-prov">${AI_PROV.map(([v,t])=>`<option value="${v}" ${S.platform.ai.provider===v?"selected":""}>${t}</option>`).join("")}</select></div></div>

  sec("Gefahrenzone","",`<div class="srow"><div class="sl"><label>Alle Fortschritte zurücksetzen</label><small>Alle Mitarbeiter starten wieder bei 0 %</small></div><div class="sv">${S.armed==="all"?`<button class="btn sm danger" id="resetall">Wirklich alles zurücksetzen?</button>`:`<button class="btn sm ghost" id="resetall">Zurücksetzen</button>`}</div></div>`)}

const LABEL={name:"Name",sub:"Zusatz",accent:"Akzentfarbe",domain:"Domain",sender:"Absender-E-Mail",support:"Support-Kontakt",lang:"Sprache",tz:"Zeitzone",pass:"Quiz-Grenze",daily:"Tagesziel",board:"Rangliste",watch:"Video-Grenze",noskip:"Vorspulen sperren",order:"Reihenfolge",remind:"Erinnerung",cert:"Zertifikat",belts:"Gürtelsystem",n_passed:"Mail: Modul bestanden",n_assign:"Mail: Zuweisung erledigt",n_inactive:"Mail: inaktiv",n_new:"Mail: neuer Login",n_weekly:"Wochenbericht",twofa:"Zwei-Faktor-Pflicht",session:"Abmelden nach",pwmin:"Passwortlänge",tries:"Sperre nach Fehlversuchen",retain:"Löschfrist",selfexport:"Selbst-Export",imprint:"Impressum",privacy:"Datenschutz",env:"Umgebung"};

function newsSec(){const N=S.cfg.news||(S.cfg.news=[]);return sec("Tipp der Woche","Wechselt automatisch jeden Montag. Einer pro Zeile, die Liste läuft im Kreis.",`<textarea id="tips" rows="6" style="width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">${esc((S.cfg.tips||[]).join("\n"))}</textarea><p class="hint">Diese Woche (KW ${isoWeek()}): ${esc(tipNow()||"–")}</p>`)+sec("Neuigkeiten auf der Startseite","„Neu“-Meldungen entstehen automatisch, wenn du eine Podcast-Folge veröffentlichst. Eigene Ankündigungen legst du hier an.",
  N.map((n,i)=>`<div class="srow"><div class="sl"><label>${esc(n.title)}</label><small>${esc(n.tag||"")}${n.soon?" · Demnächst verfügbar":""}</small></div><div class="sv row" style="gap:6px"><button class="btn sm ghost" data-nup="${i}" ${i===0?"disabled":""} aria-label="Nach oben">↑</button><button class="btn sm ghost" data-ndel="${i}">Entfernen</button></div></div>`).join("")+
  `<form class="subform" id="nf"><div class="row" style="gap:10px"><div class="field" style="flex:1"><label class="lbl" for="n-tag">Etikett</label><input id="n-tag" placeholder="z. B. Neu, Tipp, Podcast"></div><div class="field" style="flex:2"><label class="lbl" for="n-t">Überschrift</label><input id="n-t"></div></div>
   <div class="field"><label class="lbl" for="n-x">Text</label><input id="n-x"></div><div class="field"><label class="lbl" for="n-l">Link (optional)</label><input id="n-l" type="url" placeholder="https://"></div>
   <label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="n-s"> Als „Demnächst verfügbar“ markieren</label><label class="row" style="gap:8px"><input type="checkbox" id="n-d"> Dunkle Karte</label><div><button class="btn primary" type="submit">Neuigkeit hinzufügen</button></div></form>`)}
function wireNews(){const N=S.cfg.news||(S.cfg.news=[]);if($("tips"))$("tips").onchange=e=>{S.cfg.tips=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);audit("Tipps der Woche geändert");toast("Gespeichert");settings()};document.querySelectorAll("[data-ndel]").forEach(b=>b.onclick=()=>{const x=N.splice(+b.dataset.ndel,1)[0];audit("Neuigkeit entfernt: "+x.title);settings()});
  document.querySelectorAll("[data-nup]").forEach(b=>b.onclick=()=>{const i=+b.dataset.nup;[N[i-1],N[i]]=[N[i],N[i-1]];settings()});
  const f=$("nf");if(f)f.onsubmit=e=>{e.preventDefault();const t=$("n-t").value.trim();if(!t){toast("Bitte eine Überschrift eingeben");return}N.push({tag:$("n-tag").value.trim(),title:t,text:$("n-x").value.trim(),link:$("n-l").value.trim(),soon:$("n-s").checked,dark:$("n-d").checked});audit("Neuigkeit: "+t);toast("Neuigkeit hinzugefügt");settings()}}

function settings(){
  const TB=isOwner()?TABS:[["general","Design"],["learn","Lernregeln"]];if(!TB.some(t=>t[0]===S.setTab))S.setTab="general";
  const T={general:tabGeneral,learn:tabLearn,notify:tabNotify,roles:tabRoles,security:tabSecurity,dev:tabDev}[S.setTab]||tabGeneral;
  $("view").innerHTML=`<div class="phead"><div><h1>Einstellungen</h1><p class="muted">${isOwner()?"Gilt für die ganze Academy. Änderungen werden sofort übernommen.":"Design und Lernregeln eurer Academy. Änderungen gelten sofort für alle eure Mitarbeiter."}</p></div></div>
  ${TB.length>1?`<div class="tabs" role="tablist">${TB.map(([k,t])=>`<button role="tab" aria-selected="${S.setTab===k}" class="tab ${S.setTab===k?"on":""} ${k==="dev"?"dev":""}" data-tab="${k}">${k==="dev"?"&lt;/&gt; ":""}${t}</button>`).join("")}</div>`:""}
  <div class="spane">${T()}</div>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.setTab=b.dataset.tab;S.newKey=null;settings()});wireNews();
  document.querySelectorAll("[data-k]").forEach(el=>el.onchange=()=>{const k=el.dataset.k;let v=el.type==="checkbox"?el.checked:el.dataset.num!=null?+el.value:el.value;
    if(el.dataset.num!=null){v=Math.min(+el.max,Math.max(+el.min,v||+el.min));el.value=v}
    S.cfg[k]=v;audit(`${LABEL[k]||k}: ${typeof v==="boolean"?(v?"an":"aus"):v}`);applyCfg();toast("Gespeichert");
    if(["accent","name","sub"].includes(k))shell()});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast("Kopiert")}catch(e){toast("Kopieren nicht möglich, bitte markieren")}});
  const lg=$("c-logo");if(lg)lg.onchange=()=>{const f=lg.files[0];if(!f)return;if(f.size>500000){toast("Logo bitte kleiner als 500 KB");return}const r=new FileReader();r.onload=()=>{S.cfg.logo=r.result;audit("Logo geändert");toast("Logo gespeichert");shell()};r.readAsDataURL(f)};
  if($("logox"))$("logox").onclick=()=>{S.cfg.logo=null;audit("Logo entfernt");shell()};
  if($("accx"))$("accx").onclick=()=>{S.cfg.accent="#f08a24";audit("Akzentfarbe: Standard");applyCfg();shell()};

async function saveFile(name,blob){const msg=$("dlm");if(msg)msg.hidden=false;const dl=window.claude?await window.claude.use("downloads"):null;
